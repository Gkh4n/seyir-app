async function submitSeyirAuth(e){
  e.preventDefault();
  if(!seyirDb)return;
  var register=!!document.getElementById('authUsername');
  var email=document.getElementById('authEmail').value.trim();
  var password=document.getElementById('authPassword').value;
  var msg=document.getElementById('authMessage');
  var submit=e.currentTarget.querySelector('button[type="submit"]');
  submit.disabled=true;msg.textContent='';
  try{
    var res;
    if(register){
      var username=document.getElementById('authUsername').value.trim();
      var displayName=document.getElementById('authDisplayName').value.trim();
      if(!/^[A-Za-z0-9_]{3,20}$/.test(username))throw new Error('Kullanıcı adı 3–20 karakter olmalı; harf, rakam ve _ kullanabilirsin.');
      res=await seyirDb.auth.signUp({email:email,password:password,options:{data:{username:username,display_name:displayName}}});
      if(res.error)throw res.error;
      if(res.data&&res.data.session){
        currentUser=res.data.session.user;await loadMySeyirProfile();closeSocialModal();location.hash='profile'
      }else{
        msg.textContent='Hesap oluşturuldu. E-postandaki doğrulama bağlantısını açıp giriş yap.'
      }
    }else{
      res=await seyirDb.auth.signInWithPassword({email:email,password:password});
      if(res.error)throw res.error;
      currentUser=res.data.user;await loadMySeyirProfile();closeSocialModal();location.hash='profile'
    }
  }catch(err){
    msg.textContent=err&&err.message?err.message:'İşlem tamamlanamadı.'
  }finally{submit.disabled=false}
}

  var start=(d.first_air_date||'').slice(0,4);

  var ongoing=d.in_production===true||['Returning Series','In Production','Planned'].indexOf(d.status)>-1;

  var ch=(title||'S').charCodeAt(0)%5;

function tmdbToItem(r){
  var mt=r.media_type||(r.number_of_seasons!=null?'tv':'movie');
  var title=r.title||r.name||'İsimsiz';
  var date=r.release_date||r.first_air_date||'';
  return {
    key:'tmdb-'+mt+'-'+r.id,
    source:'tmdb',
    tmdbId:r.id,
    mediaType:mt,
    type:mediaLabel(mt),
    title:title,
    year:date?date.slice(0,4):'—',
    genre:'',
    public:Number(r.vote_average||0),
    voteCount:Number(r.vote_count||0),
    poster:posterValue(r.poster_path,title),

  };
}

      year:x.year,genre:x.genre,public:x.public,voteCount:Number(x.voteCount||0),poster:x.poster,posterPath:x.posterPath||null,backdropPath:x.backdropPath||null
    };

  }

function getItem(key){return saved.items[key]||null}
function syncFavoriteOrder(){
  if(!saved.favoriteOrder)saved.favoriteOrder={tv:[],movie:[]};
  ['tv','movie'].forEach(function(type){
    if(!Array.isArray(saved.favoriteOrder[type]))saved.favoriteOrder[type]=[];
    var valid=saved.favorites.filter(function(key){
      var item=getItem(key);
      return item&&item.mediaType===type
    });
    saved.favoriteOrder[type]=saved.favoriteOrder[type].filter(function(key){return valid.indexOf(key)>-1});
    valid.forEach(function(key){if(saved.favoriteOrder[type].indexOf(key)===-1)saved.favoriteOrder[type].push(key)})
  })
}
function favoriteItemsByType(type){
  syncFavoriteOrder();

}
function moveFavoriteItem(type,key,direction){
  syncFavoriteOrder();
  var arr=saved.favoriteOrder[type];
  var i=arr.indexOf(key);
  var next=i+direction;
  if(i<0||next<0||next>=arr.length)return;
  var temp=arr[i];arr[i]=arr[next];arr[next]=temp;
  persist()
}

function reactionLabel(type){
  return {like:'👍',love:'❤️',haha:'😂',sad:'😢'}[type]||'👍'

function formatCommentTime(value){
  try{
    var d=new Date(value),diff=(Date.now()-d.getTime())/1000;
    if(diff<60)return 'şimdi';
    if(diff<3600)return Math.floor(diff/60)+' dk';
    if(diff<86400)return Math.floor(diff/3600)+' sa';
    if(diff<604800)return Math.floor(diff/86400)+' gün';
    return d.toLocaleDateString('tr-TR')
  }catch(e){return ''}
}
function renderSocialCommentRow(comment,profiles,reactions,children,level){
  var profile=profiles[comment.user_id]||{};
  var own=currentUser&&currentUser.id===comment.user_id;
  var reacts=reactions.filter(function(r){return r.comment_id===comment.id});
  var counts={like:0,love:0,haha:0,sad:0};
  reacts.forEach(function(r){if(counts[r.reaction]!=null)counts[r.reaction]++});
  var mine=currentUser?reacts.find(function(r){return r.user_id===currentUser.id}):null;
  var replies=(children[comment.id]||[]).map(function(c){return renderSocialCommentRow(c,profiles,reactions,children,(level||0)+1)}).join('');
  return '<article class="socialComment '+((level||0)>0?'reply':'')+'" data-comment-id="'+comment.id+'"><button class="commentAvatar" data-user-profile="'+h(profile.username||'')+'">'+commentAvatar(profile)+'</button><div class="commentBody"><div class="commentMeta"><button data-user-profile="'+h(profile.username||'')+'"><b>'+h(profile.display_name||profile.username||'Kullanıcı')+'</b><span>@'+h(profile.username||'')+'</span></button><time>'+formatCommentTime(comment.created_at)+'</time></div><p>'+h(comment.body)+'</p><div class="commentActions"><div class="reactionStrip">'+['like','love','haha','sad'].map(function(type){var n=counts[type];return '<button class="reactionBtn '+(mine&&mine.reaction===type?'active':'')+'" data-comment-react="'+comment.id+'" data-reaction="'+type+'">'+reactionLabel(type)+(n?'<span>'+n+'</span>':'')+'</button>'}).join('')+'</div>'+(currentUser?'<button class="replyToggle" data-reply-to="'+comment.id+'">Yanıtla</button>':'')+(own?'<button class="deleteComment" data-delete-comment="'+comment.id+'">Sil</button>':'')+'</div><div class="replyComposer" id="reply-'+comment.id+'"></div>'+replies+'</div></article>'
}
async function loadSocialComments(x){
  var area=document.getElementById('socialCommentsList');
  if(!area||!seyirDb||!x)return;
  var type=x.mediaType==='movie'?'movie':'tv';
  var commentsRes=await seyirDb.from('seyir_comments').select('*').eq('media_type',type).eq('media_id',x.tmdbId).order('created_at',{ascending:true});
  if(commentsRes.error){area.innerHTML='<div class="profileEmpty">Yorumlar şu an yüklenemedi.</div>';return}
  var comments=commentsRes.data||[];
  if(!comments.length){area.innerHTML='<div class="socialEmpty">İlk yorumu sen yap.</div>';bindCommentUI(x);return}
  var userIds=[...new Set(comments.map(function(c){return c.user_id}))];
  var ids=comments.map(function(c){return c.id});
  var profilesRes=await seyirDb.from('seyir_profiles').select('user_id,username,display_name,bio,avatar_image_path,avatar_character,avatar_show').in('user_id',userIds);
  var reactionsRes=await seyirDb.from('seyir_comment_reactions').select('*').in('comment_id',ids);
  var profiles={};
  (profilesRes.data||[]).forEach(function(p){profiles[p.user_id]=p});
  var reactions=reactionsRes.data||[];
  var children={};
  var roots=[];
  comments.forEach(function(c){
    if(c.parent_id){if(!children[c.parent_id])children[c.parent_id]=[];children[c.parent_id].push(c)}
    else roots.push(c)
  });
  area.innerHTML=roots.map(function(c){return renderSocialCommentRow(c,profiles,reactions,children,0)}).join('');
  bindCommentUI(x)
}
function bindCommentUI(x){
  document.querySelectorAll('[data-open-auth]').forEach(function(b){b.onclick=function(){openAuthModal(b.getAttribute('data-open-auth')||'login')}});
  document.querySelectorAll('[data-user-profile]').forEach(function(b){b.onclick=function(){
    var u=b.getAttribute('data-user-profile');if(u)location.hash='user/'+encodeURIComponent(u)
  }});
  var ta=document.getElementById('newSocialComment');
  var counter=document.getElementById('commentComposerCount');
  if(ta&&counter)ta.oninput=function(){counter.textContent=ta.value.length+' / 1000'};
  var submit=document.getElementById('submitSocialComment');
  if(submit)submit.onclick=async function(){
    var body=(ta.value||'').trim();if(!body||!currentUser)return;
    submit.disabled=true;
    var r=await seyirDb.from('seyir_comments').insert({user_id:currentUser.id,media_type:x.mediaType==='movie'?'movie':'tv',media_id:x.tmdbId,body:body});
    submit.disabled=false;
    if(!r.error){ta.value='';if(counter)counter.textContent='0 / 1000';loadSocialComments(x)}
  };

function profileSeriesGroups(){
  var groups={};
  Object.keys(saved.episodeRatings).forEach(function(key){
    var m=key.match(/^(tmdb-tv-\d+)-s(\d+)e(\d+)$/);
    if(!m)return;
    var showKey=m[1];
    if(!groups[showKey])groups[showKey]={key:showKey,ratings:[],byEpisode:{}};
    var rating=Number(saved.episodeRatings[key]);
    if(isFinite(rating)){
      groups[showKey].ratings.push(rating);
      groups[showKey].byEpisode['s'+Number(m[2])+'e'+Number(m[3])]=rating
    }
  });
  return Object.keys(groups).map(function(k){
    var g=groups[k];
    g.item=getItem(k);
    g.count=g.ratings.length;
    g.avg=g.count?g.ratings.reduce(function(a,b){return a+b},0)/g.count:0;
    return g
  }).filter(function(g){return g.item&&g.item.mediaType==='tv'})
}
function miniRatingClass(v){
  if(v==null)return '';
  return scoreClass(Number(v))
}
function buildMiniSeriesChart(g,d){
  var cells=[];
  (d.seasons||[]).filter(function(s){return Number(s.season_number)>0}).forEach(function(s){
    var count=Math.max(0,Number(s.episode_count||0));
    for(var e=1;e<=count;e++){
      cells.push({season:Number(s.season_number),episode:e,rating:g.byEpisode['s'+Number(s.season_number)+'e'+e]})
    }
  });
  var total=cells.length;
  var limit=80;
  var shown=cells.slice(0,limit);
  var out=shown.map(function(c){
    return '<i class="profileMiniCell '+miniRatingClass(c.rating)+'" title="S'+c.season+'B'+c.episode+(c.rating!=null?' · '+Number(c.rating).toFixed(1):'')+'"></i>'
  }).join('');
  if(total>limit)out+='<i class="profileMiniCell more">+'+(total-limit)+'</i>';
  return {html:out,total:total}
}
function renderProfileSeriesCards(rows){
  var area=document.getElementById('profileSeriesGrid');
  if(!area)return;
  var q=(document.getElementById('profileSeriesSearch')||{}).value||'';
  var sort=(document.getElementById('profileSeriesSort')||{}).value||'rated';
  q=normalizeText(q.trim());
  var list=rows.filter(function(r){return !q||normalizeText(r.item.title).indexOf(q)>-1});
  list.sort(function(a,b){
    if(sort==='avg')return b.avg-a.avg||b.count-a.count;
    if(sort==='title')return a.item.title.localeCompare(b.item.title,'tr');
    return b.count-a.count||b.avg-a.avg
  });
  if(!list.length){area.innerHTML='<div class="profileEmpty" style="grid-column:1/-1">Bu aramaya uyan dizi yok.</div>';return}
  area.innerHTML=list.map(function(r){
    var mineSeries=saved.ratings[r.item.key]!=null?Number(saved.ratings[r.item.key]):null;

function profileProgressGroups(){
  var groups={};
  Object.keys(saved.episodeRatings).forEach(function(key){
    var m=key.match(/^(tmdb-tv-\d+)-s(\d+)e(\d+)$/);
    if(!m)return;
    var showKey=m[1];
    if(!groups[showKey])groups[showKey]={key:showKey,count:0,maxSeason:0,maxEpisode:0};
    groups[showKey].count++;
    var s=Number(m[2]),e=Number(m[3]);
    if(s>groups[showKey].maxSeason||(s===groups[showKey].maxSeason&&e>groups[showKey].maxEpisode)){
      groups[showKey].maxSeason=s;groups[showKey].maxEpisode=e
    }
  });
  return Object.keys(groups).map(function(k){return groups[k]}).sort(function(a,b){return b.count-a.count})
}

function chart(data){
  if(!data.length)return '<div class="loading">Bu sezon için bölüm verisi yok.</div>';
  var w=700,hgt=220,p=28;
  function y(v){return hgt-p-(Math.max(0,Math.min(10,Number(v||0)))/10)*(hgt-2*p)}
  function pointX(i){return p+i*(w-2*p)/(Math.max(1,data.length-1))}
  function path(idx){
    var pts=[];
    data.forEach(function(e,i){var v=e[idx];if(v!=null&&Number(v)>0)pts.push((pts.length?'L':'M')+pointX(i)+' '+y(v))});
    return pts.join(' ')
  }
  var dots=data.map(function(e,i){return e[3]!=null?'<circle cx="'+pointX(i)+'" cy="'+y(e[3])+'" r="3.5" fill="#8a7dff"/>':''}).join('');
  return '<svg viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none"><line x1="'+p+'" y1="'+y(5)+'" x2="'+(w-p)+'" y2="'+y(5)+'" stroke="#2d3442"/><path d="'+path(2)+'" fill="none" stroke="#ffc85a" stroke-width="3"/><path d="'+path(3)+'" fill="none" stroke="#8a7dff" stroke-width="3"/>'+dots+'</svg>'
}

async function loadCatalogue(type){
  var grid=document.getElementById('catalogGrid');

  if(!grid)return;
  var cached=getCachedCatalog(type);

    var cachedItems=(cached.results||[]).slice(0,20).map(tmdbToItem);
    if(!grid.children.length)grid.innerHTML=cachedItems.map(card).join('');
    bindOpeners()
  }
  try{
    var data=await api({action:'catalog',type:type,genre:catalogGenres[type]||'all',sort:catalogSorts[type]||'rating'});

    var items=(data.results||[]).slice(0,20).map(tmdbToItem);

      meta.textContent=items.length+' '+genreText+(type==='tv'?'dizi':type==='movie'?'film':'anime')+' · '+(sort==='rating'?'puana göre':'popülerliğe göre')+' sıralı'

  }

async function categorySearch(type,forcedQuery){
  var input=document.getElementById('catalogQ');
  var box=document.getElementById('catalogSearchResults');
  if(!box)return;
  var q=(forcedQuery!=null?forcedQuery:(input&&input.value||'')).trim();
  if(!q){box.innerHTML='';return}
  var mySeq=++searchSeq;
  box.innerHTML='<div class="muted">Aranıyor…</div>';
  try{
    var data=await api({action:'search',q:q,type:type,genre:catalogGenres[type]||'all'});
    if(mySeq!==searchSeq)return;
    var nq=normalizeText(q);
    var items=(data.results||[]).map(tmdbToItem).sort(function(a,b){
      var at=normalizeText(a.title),bt=normalizeText(b.title);
      var ae=at===nq?1:0,be=bt===nq?1:0;
      if(ae!==be)return be-ae;
      var as=at.indexOf(nq)===0?1:0,bs=bt.indexOf(nq)===0?1:0;
      if(as!==bs)return bs-as;
      return Number(b.public||0)-Number(a.public||0)
    }).slice(0,8);
    box.innerHTML=items.length?items.map(searchResultRow).join(''):'<div class="muted">Bu kategoride sonuç bulunamadı.</div>';
    bindOpeners()
  }catch(err){
    if(mySeq!==searchSeq)return;
    box.innerHTML='<div class="notice">Arama şu an kullanılamıyor.</div>'
  }
}

  return String(v||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()
}

function scoreClass(v){
  var n=Number(v||0);
  if(!n)return 'empty';
  if(n>=9.5)return 's95';
  if(n>=9)return 's90';
  if(n>=8)return 's80';
  if(n>=7)return 's70';
  if(n>=6)return 's60';
  if(n>=5)return 's50';
  return 's00'
}
function episodeMine(x,season,episode){
  var key=x.key+'-s'+season+'e'+episode;
  return saved.episodeRatings[key]!=null?Number(saved.episodeRatings[key]):null
}
function getMatrixEpisode(season,episode){
  var s=currentMatrixData.find(function(x){return Number(x.season)===Number(season)});
  return s?(s.episodes||[]).find(function(e){return Number(e.episode_number)===Number(episode)}):null
}
function showEpisodeDetail(season,episode,shouldScroll){

  if(!ep||!panel||!currentMatrixItem)return;
  var mine=episodeMine(currentMatrixItem,season,episode);
  var still=ep.still_path?"url('https://image.tmdb.org/t/p/w500"+ep.still_path+"') center/cover":"linear-gradient(135deg,#18202d,#0d1118)";
  var code='S'+season+'B'+episode;
  panel.innerHTML='<div class="episodeDetailInner"><div class="episodeStill" style="--still:'+still+'"></div><div class="episodeDetailText"><div class="episodeCode">'+code+'</div><h3>'+h(ep.name||('Bölüm '+episode))+'</h3><div class="episodeDetailMeta"><span>Genel <b>'+publicScore(ep.vote_average)+'</b></span><span>'+formatVotes(ep.vote_count)+'</span>'+(ep.air_date?'<span>'+h(ep.air_date)+'</span>':'')+'</div>'+(ep.overview?'<p>'+h(ep.overview)+'</p>':'')+'<div class="episodeMineInline"><span class="muted">Benim puanım</span><input id="episodeDetailRating" class="episodeRating" type="number" min="1" max="10" step=".1" placeholder="—" value="'+(mine==null?'':mine.toFixed(1))+'"></div></div></div>';

    rememberItem(currentMatrixItem);persist();
    renderEpisodeMatrix();renderTopEpisodes();showEpisodeDetail(season,episode,false)
  };

      if(target)target.scrollIntoView({behavior:'smooth',block:'center'})
    })
  }

function renderTopEpisodes(){

  var all=[];
  currentMatrixData.forEach(function(s){
    (s.episodes||[]).forEach(function(ep){
      var score=Number(ep.vote_average||0);
      if(score>0)all.push({season:s.season,ep:ep,score:score})
    })
  });
  all.sort(function(a,b){return b.score-a.score||Number(b.ep.vote_count||0)-Number(a.ep.vote_count||0)});
  var top=all.slice(0,6);
  area.innerHTML=top.length?top.map(function(item){
    var ep=item.ep;
    var img=ep.still_path?"url('https://image.tmdb.org/t/p/w300"+ep.still_path+"') center/cover":"linear-gradient(135deg,#18202d,#0d1118)";
    return '<div class="topEpisode" data-top-season="'+item.season+'" data-top-episode="'+ep.episode_number+'"><div class="topEpisodeImg" style="--ep-img:'+img+'"></div><div class="topEpisodeInfo"><b>'+h(ep.name||('Bölüm '+ep.episode_number))+'</b><span>S'+item.season+'B'+ep.episode_number+' · '+formatVotes(ep.vote_count)+'</span></div><div class="topEpisodeScore">'+publicScore(item.score)+'</div></div>'

function renderEpisodeMatrix(){
  var area=document.getElementById('matrixArea');
  if(!area||!currentMatrixItem||!currentMatrixData.length)return;
  var seasons=currentMatrixData;
  var maxEpisodes=0;
  seasons.forEach(function(s){maxEpisodes=Math.max(maxEpisodes,(s.episodes||[]).length)});
  var shownEpisodes=Math.min(maxEpisodes,60);
  var head='<tr><th></th>'+seasons.map(function(s){return '<th>S'+s.season+'</th>'}).join('')+'</tr>';
  var rows='';
  for(var epNo=1;epNo<=shownEpisodes;epNo++){
    rows+='<tr><td>B'+epNo+'</td>';
    seasons.forEach(function(s){
      var ep=(s.episodes||[]).find(function(e){return Number(e.episode_number)===epNo});
      if(!ep){rows+='<td><div class="scoreCell empty">—</div></td>';return}
      var val=currentMatrixMode==='mine'?episodeMine(currentMatrixItem,s.season,epNo):Number(ep.vote_average||0);
      var label=val!=null&&Number(val)>0?Number(val).toFixed(1):'—';
      var title=(ep.name||('Bölüm '+epNo))+' · '+label;
      var votes=Number(ep.vote_count||0);
      rows+='<td><div class="scoreCell '+scoreClass(val)+'" data-matrix-season="'+s.season+'" data-matrix-episode="'+epNo+'" data-matrix-name="'+h(ep.name||('Bölüm '+epNo))+'" data-matrix-score="'+h(label)+'" data-matrix-votes="'+votes+'" title="'+h(title)+'">'+label+'</div></td>'
    });
    rows+='</tr>'
  }
  rows+='<tr><td class="avgCell">ORT.</td>';
  seasons.forEach(function(s){
    var vals=(s.episodes||[]).map(function(ep){return currentMatrixMode==='mine'?episodeMine(currentMatrixItem,s.season,ep.episode_number):Number(ep.vote_average||0)}).filter(function(v){return v!=null&&Number(v)>0});
    var avg=vals.length?vals.reduce(function(a,b){return a+Number(b)},0)/vals.length:0;
    rows+='<td><div class="scoreCell avgCell '+scoreClass(avg)+'">'+(avg?avg.toFixed(1):'—')+'</div></td>'
  });
  rows+='</tr>';
  var note=maxEpisodes>60?'<div class="matrixNote">Bu yapım çok uzun olduğu için haritada ilk 60 bölüm gösteriliyor; sezon ayrıntısından diğer bölümlere erişebilirsin.</div>':'';
  area.className='episodeMatrixWrap';
  area.innerHTML='<table class="episodeMatrix">'+head+rows+'</table>'+note;
  document.querySelectorAll('[data-matrix-season]').forEach(function(cell){cell.onclick=function(){
    var season=Number(cell.getAttribute('data-matrix-season'));
    var episode=Number(cell.getAttribute('data-matrix-episode'));
    showEpisodeDetail(season,episode,true);
    activeRatingSeason=season;
    var select=document.getElementById('seasonSelect');
    if(select)select.value=String(season);
    renderSeasonTabs(currentMatrixItem);
    loadSeason(currentMatrixItem,season)
  }});
  document.querySelectorAll('[data-matrix-mode]').forEach(function(btn){
    btn.classList.toggle('active',btn.getAttribute('data-matrix-mode')===currentMatrixMode);
    btn.onclick=function(){currentMatrixMode=btn.getAttribute('data-matrix-mode');renderEpisodeMatrix()}
  })
}
async function loadEpisodeMatrix(x,count){
  var area=document.getElementById('matrixArea');
  if(!area)return;
  currentMatrixItem=x;
  currentMatrixMode='public';
  currentMatrixData=[];
  area.className='loading';
  area.innerHTML='Bölüm puanları yükleniyor…';
  var limit=Math.min(Number(count||1),20);
  try{
    var jobs=[];
    for(var s=1;s<=limit;s++)jobs.push(api({action:'season',type:'tv',id:x.tmdbId,season:s}).then(function(d){return d}));
    var data=await Promise.all(jobs);
    currentMatrixData=data.map(function(d,i){return {season:i+1,episodes:d.episodes||[]}}).filter(function(s){return s.episodes.length});
    if(!currentMatrixData.length){area.className='emptyState';area.textContent='Bölüm puanı verisi bulunamadı.';return}
    renderEpisodeMatrix();
    renderTopEpisodes();
    renderSeasonTabs(x);
    document.querySelectorAll('[data-matrix-mode]').forEach(function(btn){btn.onclick=function(){
      currentMatrixMode=btn.getAttribute('data-matrix-mode');
      renderEpisodeMatrix()
    }})
  }catch(err){
    area.className='emptyState';
    area.textContent='Bölüm puanları şu an yüklenemedi.'
  }
}

function episodeRatingKey(x,season,episode){return x.key+'-s'+season+'e'+episode}
function currentEpisodeRating(x,season,episode){
  var key=episodeRatingKey(x,season,episode);
  if(Object.prototype.hasOwnProperty.call(pendingEpisodeRatings,key))return pendingEpisodeRatings[key];
  return saved.episodeRatings[key]!=null?Number(saved.episodeRatings[key]):null
}
function hasPendingEpisodeChanges(){return Object.keys(pendingEpisodeRatings).length>0}
function renderSeasonTabs(x){
  var tabs=document.getElementById('seasonTabs');
  if(!tabs||!currentMatrixData.length)return;
  tabs.innerHTML=currentMatrixData.map(function(s){
    var total=(s.episodes||[]).length;
    var rated=(s.episodes||[]).filter(function(ep){return currentEpisodeRating(x,s.season,ep.episode_number)!=null}).length;
    return '<button class="seasonTab '+(Number(s.season)===Number(activeRatingSeason)?'active':'')+'" data-season-tab="'+s.season+'">S'+s.season+' <small>'+rated+'/'+total+'</small></button>'
  }).join('');
  tabs.querySelectorAll('[data-season-tab]').forEach(function(btn){btn.onclick=function(){
    activeRatingSeason=Number(btn.getAttribute('data-season-tab'));
    var select=document.getElementById('seasonSelect');if(select)select.value=String(activeRatingSeason);
    renderSeasonTabs(x);loadSeason(x,activeRatingSeason)
  }})
}
function setEpisodeRatingPending(x,season,episode,value){
  var key=episodeRatingKey(x,season,episode);
  var original=saved.episodeRatings[key]!=null?Number(saved.episodeRatings[key]):null;
  if(value==null||value===''){
    if(original==null)delete pendingEpisodeRatings[key];else pendingEpisodeRatings[key]=null
  }else{
    var v=Number(value);
    if(!isFinite(v)||v<1||v>10)return;
    if(original!=null&&Math.abs(original-v)<.001)delete pendingEpisodeRatings[key];else pendingEpisodeRatings[key]=v
  }
  updateEpisodeSaveBar();
}
function updateEpisodeSaveBar(){
  var bar=document.getElementById('episodeSaveBar');
  var btn=document.getElementById('saveEpisodeRatings');
  var n=Object.keys(pendingEpisodeRatings).length;
  if(bar)bar.classList.toggle('hidden',n===0);
  if(btn)btn.disabled=false
}
function renderEpisodeRateControl(x,season,ep){
  var val=currentEpisodeRating(x,season,ep.episode_number);
  var key=h(episodeRatingKey(x,season,ep.episode_number));
  if(episodeRatingMode==='decimal'){
    return '<div class="decimalRate"><input data-decimal-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'" type="number" min="1" max="10" step=".1" placeholder="—" value="'+(val==null?'':Number(val).toFixed(1))+'"></div>'+(val!=null?'<button class="clearEpRating" data-clear-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'">Puanı kaldır</button>':'')
  }
  var stars='';
  for(var i=1;i<=10;i++)stars+='<button class="'+(val!=null&&i<=Math.round(Number(val))?'on':'')+'" data-star-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'" data-star="'+i+'" aria-label="'+i+' puan">★</button>';
  return '<div class="starRate star-'+scoreClass(val)+'">'+stars+'</div>'+(val!=null?'<button class="clearEpRating" data-clear-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'">Puanı kaldır</button>':'')
}
function renderSeasonEditor(x,season,d){
  var area=document.getElementById('seasonArea');
  if(!area||!d)return;
  activeRatingSeason=Number(season||1);
  renderSeasonTabs(x);
  var episodes=d.episodes||[];
  area.className='';
  area.innerHTML='<div class="episodeRatingList">'+episodes.map(function(ep){
    var still=ep.still_path?"url('https://image.tmdb.org/t/p/w500"+ep.still_path+"') center/cover":"linear-gradient(135deg,#18202d,#0d1118)";
    return '<div class="episodeRatingRow"><div class="episodeNo">'+ep.episode_number+'</div><div class="episodeRaterMain"><div class="episodeRaterTop"><div class="episodeRaterTitle"><b>'+h(ep.name||('Bölüm '+ep.episode_number))+'</b><span>'+(ep.air_date?h(ep.air_date):'Tarih bilgisi yok')+'</span><div class="episodeGeneralMeta"><span>Genel <b>'+publicScore(ep.vote_average)+'</b></span><span>'+formatVotes(ep.vote_count)+'</span></div></div><div class="episodeRaterStill" style="--epstill:'+still+'"></div></div>'+(ep.overview?'<p class="episodeRaterOverview">'+h(ep.overview)+'</p>':'')+'</div><div class="episodeRateControl">'+renderEpisodeRateControl(x,activeRatingSeason,ep)+'</div></div>'
  }).join('')+'</div><div id="episodeSaveBar" class="episodeSaveBar hidden"><button id="saveEpisodeRatings" class="episodeSaveBtn">Değişiklikleri kaydet</button></div>';
  bindEpisodeRatingEditor(x,activeRatingSeason)
}
function bindEpisodeRatingEditor(x,season){
  document.querySelectorAll('[data-star-ep]').forEach(function(btn){btn.onclick=function(){
    setEpisodeRatingPending(x,season,Number(btn.getAttribute('data-episode')),Number(btn.getAttribute('data-star')));
    renderSeasonEditor(x,season,seasonDataCache[season]);
    renderSeasonTabs(x)
  }});
  document.querySelectorAll('[data-decimal-ep]').forEach(function(inp){inp.oninput=function(){
    var raw=inp.value;
    if(raw===''){setEpisodeRatingPending(x,season,Number(inp.getAttribute('data-episode')),null);renderSeasonTabs(x);return}
    var v=Number(raw);if(v>=1&&v<=10){setEpisodeRatingPending(x,season,Number(inp.getAttribute('data-episode')),v);renderSeasonTabs(x)}
  }});
  document.querySelectorAll('[data-clear-ep]').forEach(function(btn){btn.onclick=function(){
    setEpisodeRatingPending(x,season,Number(btn.getAttribute('data-episode')),null);
    renderSeasonEditor(x,season,seasonDataCache[season]);
    renderSeasonTabs(x)
  }});
  var stars=document.getElementById('modeStars'),dec=document.getElementById('modeDecimal');
  if(stars){stars.classList.toggle('active',episodeRatingMode==='stars');stars.onclick=function(){episodeRatingMode='stars';renderSeasonEditor(x,season,seasonDataCache[season])}}
  if(dec){dec.classList.toggle('active',episodeRatingMode==='decimal');dec.onclick=function(){episodeRatingMode='decimal';renderSeasonEditor(x,season,seasonDataCache[season])}}
  var save=document.getElementById('saveEpisodeRatings');
  if(save)save.onclick=function(){
    Object.keys(pendingEpisodeRatings).forEach(function(key){
      var v=pendingEpisodeRatings[key];
      if(v==null)delete saved.episodeRatings[key];else saved.episodeRatings[key]=Number(v)
    });
    pendingEpisodeRatings={};rememberItem(x);persist();
    renderEpisodeMatrix();renderTopEpisodes();renderSeasonTabs(x);
    renderSeasonEditor(x,season,seasonDataCache[season])
  };
  updateEpisodeSaveBar()
}
async function loadSeason(x,season){
  var area=document.getElementById('seasonArea');
  if(!area)return;
  activeRatingSeason=Number(season||1);
  renderSeasonTabs(x);
  if(seasonDataCache[activeRatingSeason]){
    renderSeasonEditor(x,activeRatingSeason,seasonDataCache[activeRatingSeason]);
    return
  }
  area.className='loading';area.innerHTML='Sezon yükleniyor…';
  try{
    var d=await api({action:'season',type:'tv',id:x.tmdbId,season:activeRatingSeason});
    seasonDataCache[activeRatingSeason]=d;
    renderSeasonEditor(x,activeRatingSeason,d)
  }catch(err){
    area.className='notice';area.textContent='Sezon verileri alınamadı.'
  }
}
window.onhashchange=async function(){
  currentItem=null;
  var base=location.hash.replace('#','').split('/')[0]||'home';
  if(['home','series','movies','anime'].indexOf(base)>-1)await ensureRouteCache(base);
  render()
};
(async function boot(){
  await initSocial();
  ensureSocialOverlay();
  render();
  setTimeout(prefetchCoreViews,80)
})();
</script>
