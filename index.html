<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>Seyir — İzleme Zevkinin Haritası</title>
<style>
:root{--bg:#090b10;--panel:#121620;--panel2:#171c27;--line:#252c3a;--text:#f4f6fb;--muted:#8e98aa;--accent:#8a7dff;--accent2:#5f8cff;--warn:#ffc85a;--good:#4bd6a1;--bad:#ff7184}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#15142d 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial,sans-serif}button,input{font:inherit}.top{height:68px;display:flex;align-items:center;gap:26px;padding:0 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,11,16,.88);backdrop-filter:blur(18px);z-index:20}.brand{font-weight:900;letter-spacing:.14em;cursor:pointer}.brand b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-right:8px}.nav{display:flex;gap:6px}.nav button,.profile{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#1b202c;color:#fff}.profile{margin-left:auto;color:#fff;border:1px solid var(--line);background:var(--panel)}main{max-width:1220px;margin:auto;padding:36px 24px 90px}.hero{display:grid;grid-template-columns:1.7fr .7fr;gap:18px}.box{border:1px solid var(--line);background:linear-gradient(145deg,rgba(22,26,38,.9),rgba(12,15,22,.9));border-radius:26px}.hero .copy{padding:42px}.eyebrow{color:#b8b0ff;text-transform:uppercase;font-size:12px;letter-spacing:.1em;font-weight:800}.hero h1{font-size:clamp(38px,5vw,68px);line-height:1.02;margin:14px 0 16px}.hero h1 span{background:linear-gradient(90deg,#fff,#9f97ff,#67a7ff);-webkit-background-clip:text;color:transparent}.hero p{max-width:700px;color:#aab3c3;font-size:17px}.search{display:flex;gap:8px;margin-top:24px;padding:7px;border:1px solid var(--line);background:#0b0e14;border-radius:15px}.search input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:10px}.search button,.primary{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;cursor:pointer}.taste{padding:28px;display:flex;flex-direction:column;justify-content:space-between}.taste strong{font-size:70px;line-height:1}.taste small{color:var(--muted)}.bar{height:10px;background:#252a35;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:82%;background:linear-gradient(90deg,var(--accent),#57b6ff)}section{margin-top:36px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.head h2{margin:0;font-size:24px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:19px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#414a5f}.poster{aspect-ratio:2/3;padding:14px;display:flex;align-items:end;position:relative;background:var(--poster);overflow:hidden}.poster:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(5,7,11,.95))}.poster .letter{position:absolute;right:-8px;top:-28px;font-size:126px;font-weight:900;color:rgba(255,255,255,.08)}.poster .tag{position:absolute;top:12px;left:12px;background:rgba(6,8,12,.7);border:1px solid rgba(255,255,255,.13);padding:5px 8px;border-radius:99px;font-size:10px}.poster .meta{position:relative;z-index:1}.poster .meta b{display:block;font-size:17px}.poster .meta span{font-size:12px;color:#cad1dc}.scores{display:flex;justify-content:space-between;padding:12px;font-size:12px}.scores b:first-child{color:var(--warn)}.scores b:last-child{color:#a89fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px}.stat strong{display:block;font-size:29px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rows{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.delta{font-weight:900;color:var(--good)}.delta.neg{color:var(--bad)}.detail{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:end}.detailposter{aspect-ratio:2/3;border-radius:22px;background:var(--poster);border:1px solid var(--line);position:relative;overflow:hidden}.detailposter:after{content:attr(data-letter);position:absolute;right:-20px;bottom:-32px;font-size:190px;font-weight:900;color:rgba(255,255,255,.08)}.detail h1{font-size:52px;line-height:1;margin:0 0 10px}.bigscore{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.scorebox{min-width:145px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.scorebox strong{display:block;font-size:25px}.slider{margin-top:18px}.slider input{width:100%}.actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.secondary{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;cursor:pointer}.chart{height:260px;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px}.chart svg{width:100%;height:100%}.episodes{display:grid;gap:8px}.ep{display:grid;grid-template-columns:55px 1fr auto auto;gap:12px;background:var(--panel2);padding:11px;border-radius:12px}.profileHero{display:flex;gap:18px;align-items:center}.avatar{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:24px;font-weight:900}.searchResults{display:grid;gap:8px;margin-top:12px}.searchItem{padding:11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer}.mobile{display:none}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.split{grid-template-columns:1fr}.detail{grid-template-columns:150px 1fr}}
@media(max-width:680px){.nav,.profile{display:none}.top{height:60px;padding:0 16px}.brand{margin:auto 0}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:10px;z-index:40;background:rgba(17,20,28,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:6px}.mobile button{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:12px;font-size:10px}.mobile button.active{background:#252b38;color:#fff}main{padding:24px 14px 100px}.hero .copy{padding:25px 20px}.hero h1{font-size:39px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.stats{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:110px 1fr}.detail h1{font-size:31px}.scorebox{min-width:0;flex:1}.ep{grid-template-columns:45px 1fr auto}.ep .mineep{display:none}}
</style>
</head>
<body>
<header class="top">
<div class="brand" data-route="home"><b>S</b>SEYİR</div>
<nav class="nav">
<button data-route="home">Keşfet</button><button data-route="series">Diziler</button><button data-route="movies">Filmler</button><button data-route="lists">Listelerim</button>
</nav>
<button class="profile" data-route="profile">Profilim</button>
</header>
<main id="app"></main>
<nav class="mobile">
<button data-route="home">⌂<br>Keşfet</button><button data-route="series">▤<br>Diziler</button><button data-route="movies">▶<br>Filmler</button><button data-route="lists">♡<br>Listeler</button><button data-route="profile">◉<br>Profil</button>
</nav>
<script>
var catalogue=[
{id:'dark',type:'Dizi',title:'Dark',year:'2017–2020',genre:'Bilim Kurgu',public:8.7,mine:9.4,poster:'linear-gradient(145deg,#0d5967,#24213f 58%,#090b10)'},
{id:'dexter',type:'Dizi',title:'Dexter',year:'2006–2013',genre:'Suç',public:8.6,mine:9.2,poster:'linear-gradient(145deg,#7a2430,#251417 58%,#090b10)'},
{id:'lost',type:'Dizi',title:'Lost',year:'2004–2010',genre:'Gizem',public:8.3,mine:9.1,poster:'linear-gradient(145deg,#668a92,#263033 58%,#090b10)'},
{id:'supernatural',type:'Dizi',title:'Supernatural',year:'2005–2020',genre:'Fantastik',public:8.4,mine:9.0,poster:'linear-gradient(145deg,#6b4d26,#241c15 58%,#090b10)'},
{id:'prisonbreak',type:'Dizi',title:'Prison Break',year:'2005–2017',genre:'Aksiyon',public:8.3,mine:8.9,poster:'linear-gradient(145deg,#686965,#252626 58%,#090b10)'},
{id:'interstellar',type:'Film',title:'Interstellar',year:'2014',genre:'Bilim Kurgu',public:8.7,mine:9.8,poster:'linear-gradient(145deg,#3e5a76,#171c26 58%,#090b10)'},
{id:'prestige',type:'Film',title:'The Prestige',year:'2006',genre:'Gizem',public:8.5,mine:9.3,poster:'linear-gradient(145deg,#8c5b32,#2c211b 58%,#090b10)'},
{id:'inception',type:'Film',title:'Inception',year:'2010',genre:'Bilim Kurgu',public:8.8,mine:9.1,poster:'linear-gradient(145deg,#3c586b,#1d252e 58%,#090b10)'},
{id:'parasite',type:'Film',title:'Parasite',year:'2019',genre:'Gerilim',public:8.5,mine:8.3,poster:'linear-gradient(145deg,#4f6549,#1b201a 58%,#090b10)'},
{id:'shutter',type:'Film',title:'Shutter Island',year:'2010',genre:'Gerilim',public:8.2,mine:9.0,poster:'linear-gradient(145deg,#5c7782,#252c30 58%,#090b10)'}
];
var episodes={
dark:[['S1B1','Sırlar',8.3,8.8],['S1B2','Yalanlar',8.5,9.0],['S1B3','Geçmiş ve Şimdi',8.7,9.1],['S1B4','Çifte Hayatlar',8.6,9.2],['S1B5','Gerçekler',8.8,9.4],['S1B6','Sic Mundus',9.1,9.7],['S1B7','Kavşak',9.0,9.6],['S1B8','Ne Ekersen',9.2,9.8],['S1B9','Her Şey Şimdi',9.3,9.9],['S1B10','Alfa ve Omega',9.5,10]],
dexter:[['S1B1','Dexter',8.7,9.2],['S1B2','Crocodile',8.4,8.8],['S1B3','Popping Cherry',8.5,9.0],['S1B4','Return to Sender',8.8,9.4],['S1B5','Seeing Red',9.2,9.8]],
lost:[['S1B1','Pilot 1',9.2,9.8],['S1B2','Pilot 2',9.0,9.6],['S1B3','Tabula Rasa',8.4,9.0],['S1B4','Walkabout',9.3,9.8],['S1B5','White Rabbit',8.5,9.1]]
};
var saved=JSON.parse(localStorage.getItem('seyir-state')||'null')||{ratings:{},favorites:['dark','interstellar'],watchlist:['shutter','prisonbreak']};
function persist(){localStorage.setItem('seyir-state',JSON.stringify(saved))}
function score(x){return saved.ratings[x.id]!=null?saved.ratings[x.id]:x.mine}
function card(x){return '<article class="card" data-detail="'+x.id+'"><div class="poster" style="--poster:'+x.poster+'"><span class="letter">'+x.title[0]+'</span><span class="tag">'+x.type+'</span><div class="meta"><b>'+x.title+'</b><span>'+x.year+' · '+x.genre+'</span></div></div><div class="scores"><span>Genel <b>'+x.public.toFixed(1)+'</b></span><span>Ben <b>'+score(x).toFixed(1)+'</b></span></div></article>'}
function section(title,sub,items){return '<section><div class="head"><div><h2>'+title+'</h2><div class="muted">'+sub+'</div></div></div><div class="grid">'+items.map(card).join('')+'</div></section>'}
function home(){
var diffs=catalogue.slice().sort(function(a,b){return Math.abs(score(b)-b.public)-Math.abs(score(a)-a.public)}).slice(0,4);
return '<div class="hero"><div class="box copy"><div class="eyebrow">✦ İzleme zevkinin haritası</div><h1>Ne izlediğini değil, <span>nasıl sevdiğini</span> gör.</h1><p>Dizi ve filmleri puanla, bölüm bölüm takip et ve kendi zevk profilini genel izleyiciyle karşılaştır.</p><div class="search"><input id="q" placeholder="Dizi veya film ara…"><button id="searchBtn">Ara</button></div><div id="searchResults" class="searchResults"></div></div><aside class="box taste"><div><div class="muted">ZEHİRK UYUM PROFİLİ</div><strong>82<small>/100</small></strong><div class="bar"><i></i></div></div><p class="muted">Gizem ve bilim kurguda genel izleyiciye göre daha cömertsin.</p></aside></div>'+
section('Öne çıkanlar','İlk prototip için örnek katalog',catalogue.slice(0,5))+
'<section><div class="head"><div><h2>Profil özeti</h2><div class="muted">Kişisel izleme verilerinin özeti</div></div></div><div class="stats"><div class="stat"><strong>34</strong><span class="muted">Tamamlanan dizi</span></div><div class="stat"><strong>127</strong><span class="muted">İzlenen film</span></div><div class="stat"><strong>1.846</strong><span class="muted">Toplam bölüm</span></div><div class="stat"><strong>8.9</strong><span class="muted">Ortalama puan</span></div></div></section>'+
'<section class="split"><div class="panel"><h3>Genel izleyiciyle en çok ayrıştıkların</h3><div class="rows">'+diffs.map(function(x){var d=score(x)-x.public;return '<div class="row" data-detail="'+x.id+'"><span><b>'+x.title+'</b><br><small class="muted">Genel '+x.public.toFixed(1)+' · Sen '+score(x).toFixed(1)+'</small></span><span class="delta '+(d<0?'neg':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</span></div>'}).join('')+'</div></div><div class="panel"><h3>Seyir kimliğin</h3><p class="muted">Bilim kurgu, gizem ve suç yapımlarına belirgin biçimde yakınsın. Bu alan daha sonra gerçek izleme geçmişinden otomatik hesaplanacak.</p></div></section>';
}
function cataloguePage(type){var items=catalogue.filter(function(x){return x.type===type});return '<div class="eyebrow">'+(type==='Dizi'?'Bölüm bölüm analiz':'Film günlüğün')+'</div><h1 style="font-size:44px;margin:8px 0"> '+(type==='Dizi'?'Diziler':'Filmler')+'</h1><p class="muted">Genel puanı kendi puanınla karşılaştır.</p>'+section(type+' kataloğu','Örnek veriler',items)}
function lists(){var fav=catalogue.filter(function(x){return saved.favorites.indexOf(x.id)>-1});var watch=catalogue.filter(function(x){return saved.watchlist.indexOf(x.id)>-1});return '<div class="eyebrow">Kişisel arşiv</div><h1>Listelerim</h1>'+section('Favorilerim','Tekrar dönmek isteyeceğin yapımlar',fav)+section('İzleme listem','Sırada bekleyenler',watch)}
function profile(){var avg=(catalogue.reduce(function(s,x){return s+score(x)},0)/catalogue.length).toFixed(1);return '<div class="box" style="padding:24px"><div class="profileHero"><div class="avatar">G</div><div><h1 style="margin:0">Gökhan\'ın seyir profili</h1><p class="muted">Kendi izleme zevkini sayılara dönüştüren profil.</p></div></div></div><section><div class="stats"><div class="stat"><strong>34</strong><span class="muted">Dizi</span></div><div class="stat"><strong>127</strong><span class="muted">Film</span></div><div class="stat"><strong>1.468</strong><span class="muted">Tahmini saat</span></div><div class="stat"><strong>'+avg+'</strong><span class="muted">Puan ortalaması</span></div></div></section><section class="split"><div class="panel"><h3>Tür zevkin</h3><div class="rows"><div class="row"><span>Bilim Kurgu</span><b>9.3</b></div><div class="row"><span>Gizem</span><b>9.1</b></div><div class="row"><span>Suç</span><b>8.8</b></div></div></div><div class="panel"><h3>Seni farklı yapan şey</h3><p class="muted">İleride gerçek kullanıcı verilerinden “genel izleyiciden ne kadar farklı puanlıyorsun?”, favori yönetmenlerin, dönemlerin ve oyuncuların otomatik çıkarılacak.</p></div></section>'}
function chart(data){var w=700,h=220,p=30;function y(v){return h-p-((v-7)/3)*(h-2*p)};function path(idx){return data.map(function(e,i){var x=p+i*(w-2*p)/(Math.max(1,data.length-1));return (i?'L':'M')+x+' '+y(e[idx])}).join(' ')}return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="'+p+'" y1="'+y(8)+'" x2="'+(w-p)+'" y2="'+y(8)+'" stroke="#2d3442"/><line x1="'+p+'" y1="'+y(9)+'" x2="'+(w-p)+'" y2="'+y(9)+'" stroke="#2d3442"/><path d="'+path(2)+'" fill="none" stroke="#ffc85a" stroke-width="3"/><path d="'+path(3)+'" fill="none" stroke="#8a7dff" stroke-width="3"/></svg>'}
function detail(id){var x=catalogue.find(function(a){return a.id===id});if(!x)return home();var eps=episodes[id]||[];var body='<div class="detail"><div class="detailposter" style="--poster:'+x.poster+'" data-letter="'+x.title[0]+'"></div><div><div class="eyebrow">'+x.type+' · '+x.genre+'</div><h1>'+x.title+'</h1><div class="muted">'+x.year+'</div><div class="bigscore"><div class="scorebox"><span class="muted">Genel puan</span><strong style="color:#ffc85a">'+x.public.toFixed(1)+'</strong></div><div class="scorebox"><span class="muted">Benim puanım</span><strong id="mineScore" style="color:#a89fff">'+score(x).toFixed(1)+'</strong></div></div><div class="slider"><input id="ratingSlider" type="range" min="1" max="10" step=".1" value="'+score(x)+'"></div><div class="actions"><button class="primary" id="saveRating">Puanı kaydet</button><button class="secondary" data-fav="'+x.id+'">'+(saved.favorites.indexOf(x.id)>-1?'♥ Favorilerde':'♡ Favoriye ekle')+'</button><button class="secondary" data-watch="'+x.id+'">'+(saved.watchlist.indexOf(x.id)>-1?'✓ Listemde':'＋ İzleme listesi')+'</button></div></div></div>';
if(x.type==='Dizi'){body+='<section class="split"><div class="panel"><h3>Bölüm puan grafiği</h3><div class="muted" style="margin-bottom:8px">Sarı: genel · Mor: sen</div><div class="chart">'+chart(eps)+'</div></div><div class="panel"><h3>1. sezon bölümleri</h3><div class="episodes">'+eps.map(function(e){return '<div class="ep"><span class="muted">'+e[0]+'</span><b>'+e[1]+'</b><span style="color:#ffc85a">'+e[2].toFixed(1)+'</span><span class="mineep" style="color:#a89fff">'+e[3].toFixed(1)+'</span></div>'}).join('')+'</div></div></section>'}else{body+='<section class="panel"><h3>Film günlüğü</h3><p class="muted">Sonraki sürümde izlenme tarihi, tekrar izleme sayısı, kısa yorum, oyuncu/yönetmen ortalamaları ve kişisel film istatistikleri burada olacak.</p></section>'}return body}
function route(){var h=location.hash.replace('#','');if(h.indexOf('detail/')===0)return detail(h.split('/')[1]);if(h==='series')return cataloguePage('Dizi');if(h==='movies')return cataloguePage('Film');if(h==='lists')return lists();if(h==='profile')return profile();return home()}
function render(){document.getElementById('app').innerHTML=route();var base=location.hash.replace('#','').split('/')[0]||'home';document.querySelectorAll('[data-route]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-route')===base)});bind()}
function bind(){document.querySelectorAll('[data-route]').forEach(function(b){b.onclick=function(){var r=b.getAttribute('data-route');location.hash=r==='home'?'':r}});document.querySelectorAll('[data-detail]').forEach(function(b){b.onclick=function(){location.hash='detail/'+b.getAttribute('data-detail')}});var slider=document.getElementById('ratingSlider');if(slider){slider.oninput=function(){document.getElementById('mineScore').textContent=Number(slider.value).toFixed(1)};document.getElementById('saveRating').onclick=function(){var id=location.hash.split('/')[1];saved.ratings[id]=Number(slider.value);persist();render()}}document.querySelectorAll('[data-fav]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-fav'),i=saved.favorites.indexOf(id);if(i>-1)saved.favorites.splice(i,1);else saved.favorites.push(id);persist();render()}});document.querySelectorAll('[data-watch]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-watch'),i=saved.watchlist.indexOf(id);if(i>-1)saved.watchlist.splice(i,1);else saved.watchlist.push(id);persist();render()}});var sb=document.getElementById('searchBtn');if(sb)sb.onclick=search;var q=document.getElementById('q');if(q)q.onkeydown=function(e){if(e.key==='Enter')search()}}
function search(){var q=(document.getElementById('q').value||'').toLocaleLowerCase('tr-TR');var hits=catalogue.filter(function(x){return x.title.toLocaleLowerCase('tr-TR').indexOf(q)>-1||x.genre.toLocaleLowerCase('tr-TR').indexOf(q)>-1});document.getElementById('searchResults').innerHTML=hits.length?hits.map(function(x){return '<div class="searchItem" data-detail="'+x.id+'"><b>'+x.title+'</b> <span class="muted">· '+x.type+' · '+x.genre+'</span></div>'}).join(''):'<div class="muted">Sonuç bulunamadı.</div>';bind()}
window.onhashchange=render;render();
</script>
</body>
</html>
