<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>Seyir — İzleme Zevkinin Haritası</title>
<style>
:root{--bg:#090b10;--panel:#121620;--panel2:#171c27;--line:#252c3a;--text:#f4f6fb;--muted:#8e98aa;--accent:#8a7dff;--accent2:#5f8cff;--warn:#ffc85a;--good:#4bd6a1;--bad:#ff7184}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#15142d 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Arial,sans-serif}button,input{font:inherit}.top{height:68px;display:flex;align-items:center;gap:26px;padding:0 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,11,16,.88);backdrop-filter:blur(18px);z-index:20}.brand{font-weight:900;letter-spacing:.14em;cursor:pointer}.brand b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-right:8px}.nav{display:flex;gap:6px}.nav button,.profile{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#1b202c;color:#fff}.profile{margin-left:auto;color:#fff;border:1px solid var(--line);background:var(--panel)}main{max-width:1220px;margin:auto;padding:36px 24px 90px}.hero{display:grid;grid-template-columns:1.7fr .7fr;gap:18px}.box{border:1px solid var(--line);background:linear-gradient(145deg,rgba(22,26,38,.9),rgba(12,15,22,.9));border-radius:26px}.hero .copy{padding:42px}.eyebrow{color:#b8b0ff;text-transform:uppercase;font-size:12px;letter-spacing:.1em;font-weight:800}.hero h1{font-size:clamp(38px,5vw,68px);line-height:1.02;margin:14px 0 16px}.hero h1 span{background:linear-gradient(90deg,#fff,#9f97ff,#67a7ff);-webkit-background-clip:text;color:transparent}.hero p{max-width:700px;color:#aab3c3;font-size:17px}.search{display:flex;gap:8px;margin-top:24px;padding:7px;border:1px solid var(--line);background:#0b0e14;border-radius:15px}.search input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:10px}.search button,.primary{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;cursor:pointer}.taste{padding:28px;display:flex;flex-direction:column;justify-content:space-between}.taste strong{font-size:70px;line-height:1}.taste small{color:var(--muted)}.bar{height:10px;background:#252a35;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:82%;background:linear-gradient(90deg,var(--accent),#57b6ff)}section{margin-top:36px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.head h2{margin:0;font-size:24px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{border:1px solid var(--line);background:var(--panel);border-radius:19px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#414a5f}.poster{aspect-ratio:2/3;padding:14px;display:flex;align-items:end;position:relative;background:var(--poster);overflow:hidden}.poster:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(5,7,11,.95))}.poster .letter{position:absolute;right:-8px;top:-28px;font-size:126px;font-weight:900;color:rgba(255,255,255,.08)}.poster .tag{position:absolute;top:12px;left:12px;background:rgba(6,8,12,.7);border:1px solid rgba(255,255,255,.13);padding:5px 8px;border-radius:99px;font-size:10px}.poster .meta{position:relative;z-index:1}.poster .meta b{display:block;font-size:17px}.poster .meta span{font-size:12px;color:#cad1dc}.scores{display:flex;justify-content:space-between;padding:12px;font-size:12px}.scores b:first-child{color:var(--warn)}.scores b:last-child{color:#a89fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:18px}.stat strong{display:block;font-size:29px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rows{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.delta{font-weight:900;color:var(--good)}.delta.neg{color:var(--bad)}.detail{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:end}.detailposter{aspect-ratio:2/3;border-radius:22px;background:var(--poster);border:1px solid var(--line);position:relative;overflow:hidden}.detailposter:after{content:attr(data-letter);position:absolute;right:-20px;bottom:-32px;font-size:190px;font-weight:900;color:rgba(255,255,255,.08)}.detail h1{font-size:52px;line-height:1;margin:0 0 10px}.bigscore{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.scorebox{min-width:145px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.scorebox strong{display:block;font-size:25px}.slider{margin-top:18px}.slider input{width:100%}.actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.secondary{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;cursor:pointer}.chart{height:260px;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px}.chart svg{width:100%;height:100%}.episodes{display:grid;gap:8px}.ep{display:grid;grid-template-columns:55px 1fr auto auto;gap:12px;background:var(--panel2);padding:11px;border-radius:12px}.profileHero{display:flex;gap:18px;align-items:center}.avatar{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:24px;font-weight:900}.searchResults{display:grid;gap:8px;margin-top:12px}.searchItem{padding:11px 13px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer}.mobile{display:none}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.split{grid-template-columns:1fr}.detail{grid-template-columns:150px 1fr}}
@media(max-width:680px){.nav,.profile{display:none}.top{height:60px;padding:0 16px}.brand{margin:auto 0}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:10px;z-index:40;background:rgba(17,20,28,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:6px}.mobile button{border:0;background:transparent;color:var(--muted);padding:8px 2px;border-radius:12px;font-size:10px}.mobile button.active{background:#252b38;color:#fff}main{padding:24px 14px 100px}.hero .copy{padding:25px 20px}.hero h1{font-size:39px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.stats{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:110px 1fr}.detail h1{font-size:31px}.scorebox{min-width:0;flex:1}.ep{grid-template-columns:45px 1fr auto}.ep .mineep{display:none}}

textarea,.fieldInput,.seasonSelect,.episodeRating{width:100%;background:#0b0e14;color:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;outline:none}
textarea{min-height:110px;resize:vertical}
.loading{padding:28px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}
.overview{max-width:820px;color:#b8c0ce;font-size:15px}
.creditList{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.creditChip{border:1px solid var(--line);background:#11151e;border-radius:99px;padding:6px 10px;color:#c5ccda;font-size:12px}
.seasonToolbar{display:flex;align-items:center;gap:10px;margin:12px 0}
.seasonSelect{width:auto;min-width:150px}
.episodeRating{width:72px;padding:6px 7px}
.notice{border:1px solid #4a4230;background:#1b1810;color:#f5d98f;border-radius:14px;padding:12px 14px;margin-top:14px}
.tmdbNote{font-size:11px;color:var(--muted);margin-top:8px}

</style>
</head>
<body>
<header class="top">
<div class="brand" data-route="home"><b>S</b>SEYİR</div>
<nav class="nav">
<button data-route="home">Keşfet</button><button data-route="series">Diziler</button><button data-route="movies">Filmler</button><button data-route="lists">Listelerim</button>
</nav>
<button class="profile" data-route="profile">Profilim</button>
</header>
<main id="app"></main>
<nav class="mobile">
<button data-route="home">⌂<br>Keşfet</button><button data-route="series">▤<br>Diziler</button><button data-route="movies">▶<br>Filmler</button><button data-route="lists">♡<br>Listeler</button><button data-route="profile">◉<br>Profil</button>
</nav>
<script>
var fallbackCatalogue=[
{id:'dark',key:'dark',source:'local',type:'Dizi',title:'Dark',year:'2017–2020',genre:'Bilim Kurgu',public:8.7,mine:9.4,poster:'linear-gradient(145deg,#0d5967,#24213f 58%,#090b10)'},
{id:'dexter',key:'dexter',source:'local',type:'Dizi',title:'Dexter',year:'2006–2013',genre:'Suç',public:8.6,mine:9.2,poster:'linear-gradient(145deg,#7a2430,#251417 58%,#090b10)'},
{id:'lost',key:'lost',source:'local',type:'Dizi',title:'Lost',year:'2004–2010',genre:'Gizem',public:8.3,mine:9.1,poster:'linear-gradient(145deg,#668a92,#263033 58%,#090b10)'},
{id:'supernatural',key:'supernatural',source:'local',type:'Dizi',title:'Supernatural',year:'2005–2020',genre:'Fantastik',public:8.4,mine:9.0,poster:'linear-gradient(145deg,#6b4d26,#241c15 58%,#090b10)'},
{id:'prisonbreak',key:'prisonbreak',source:'local',type:'Dizi',title:'Prison Break',year:'2005–2017',genre:'Aksiyon',public:8.3,mine:8.9,poster:'linear-gradient(145deg,#686965,#252626 58%,#090b10)'},
{id:'interstellar',key:'interstellar',source:'local',type:'Film',title:'Interstellar',year:'2014',genre:'Bilim Kurgu',public:8.7,mine:9.8,poster:'linear-gradient(145deg,#3e5a76,#171c26 58%,#090b10)'},
{id:'prestige',key:'prestige',source:'local',type:'Film',title:'The Prestige',year:'2006',genre:'Gizem',public:8.5,mine:9.3,poster:'linear-gradient(145deg,#8c5b32,#2c211b 58%,#090b10)'},
{id:'inception',key:'inception',source:'local',type:'Film',title:'Inception',year:'2010',genre:'Bilim Kurgu',public:8.8,mine:9.1,poster:'linear-gradient(145deg,#3c586b,#1d252e 58%,#090b10)'},
{id:'parasite',key:'parasite',source:'local',type:'Film',title:'Parasite',year:'2019',genre:'Gerilim',public:8.5,mine:8.3,poster:'linear-gradient(145deg,#4f6549,#1b201a 58%,#090b10)'},
{id:'shutter',key:'shutter',source:'local',type:'Film',title:'Shutter Island',year:'2010',genre:'Gerilim',public:8.2,mine:9.0,poster:'linear-gradient(145deg,#5c7782,#252c30 58%,#090b10)'}
];

var fallbackEpisodes={
dark:[['S1B1','Sırlar',8.3,8.8],['S1B2','Yalanlar',8.5,9.0],['S1B3','Geçmiş ve Şimdi',8.7,9.1],['S1B4','Çifte Hayatlar',8.6,9.2],['S1B5','Gerçekler',8.8,9.4],['S1B6','Sic Mundus',9.1,9.7],['S1B7','Kavşak',9.0,9.6],['S1B8','Ne Ekersen',9.2,9.8],['S1B9','Her Şey Şimdi',9.3,9.9],['S1B10','Alfa ve Omega',9.5,10]],
dexter:[['S1B1','Dexter',8.7,9.2],['S1B2','Crocodile',8.4,8.8],['S1B3','Popping Cherry',8.5,9.0],['S1B4','Return to Sender',8.8,9.4],['S1B5','Seeing Red',9.2,9.8]],
lost:[['S1B1','Pilot 1',9.2,9.8],['S1B2','Pilot 2',9.0,9.6],['S1B3','Tabula Rasa',8.4,9.0],['S1B4','Walkabout',9.3,9.8],['S1B5','White Rabbit',8.5,9.1]]
};

var saved=JSON.parse(localStorage.getItem('seyir-state')||'null')||{};
if(!saved.ratings)saved.ratings={};
if(!saved.favorites)saved.favorites=['dark','interstellar'];
if(!saved.watchlist)saved.watchlist=['shutter','prisonbreak'];
if(!saved.items)saved.items={};
if(!saved.episodeRatings)saved.episodeRatings={};
if(!saved.movieLogs)saved.movieLogs={};

var currentItem=null;

function persist(){localStorage.setItem('seyir-state',JSON.stringify(saved))}
function h(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function publicScore(v){var n=Number(v||0);return n>0?n.toFixed(1):'—'}
function personalScore(x){if(saved.ratings[x.key]!=null)return Number(saved.ratings[x.key]);if(x.source==='local'&&x.mine!=null)return Number(x.mine);return null}
function posterValue(path,title){
  if(path)return "linear-gradient(transparent 35%,rgba(5,7,11,.96)),url('https://image.tmdb.org/t/p/w500"+path+"') center/cover";
  var ch=(title||'S').charCodeAt(0)%5;
  var colors=['#263c59','#47365f','#5a382d','#29504c','#514b2f'];
  return 'linear-gradient(145deg,'+colors[ch]+',#171b23 58%,#090b10)';
}
function mediaLabel(type){return type==='tv'?'Dizi':'Film'}
function tmdbToItem(r){
  var mt=r.media_type||(r.number_of_seasons!=null?'tv':'movie');
  var title=r.title||r.name||'İsimsiz';
  var date=r.release_date||r.first_air_date||'';
  return {
    key:'tmdb-'+mt+'-'+r.id,
    source:'tmdb',
    tmdbId:r.id,
    mediaType:mt,
    type:mediaLabel(mt),
    title:title,
    year:date?date.slice(0,4):'—',
    genre:'TMDB',
    public:Number(r.vote_average||0),
    poster:posterValue(r.poster_path,title),
    posterPath:r.poster_path||null
  };
}
function rememberItem(x){
  if(x&&x.source==='tmdb'){
    saved.items[x.key]={
      key:x.key,source:'tmdb',tmdbId:x.tmdbId,mediaType:x.mediaType,type:x.type,title:x.title,
      year:x.year,genre:x.genre,public:x.public,poster:x.poster,posterPath:x.posterPath||null
    };
    persist();
  }
}
function getItem(key){
  var local=fallbackCatalogue.find(function(x){return x.key===key});
  return local||saved.items[key]||null;
}
async function api(params){
  var qs=new URLSearchParams(params);
  var res=await fetch('/api/tmdb?'+qs.toString());
  var data=await res.json().catch(function(){return {}});
  if(!res.ok)throw new Error(data.error||'API isteği başarısız');
  return data;
}
function openCode(x){return x.source==='tmdb'?'tmdb:'+x.mediaType+':'+x.tmdbId:'local:'+x.key}
function openFromCode(code){
  var p=code.split(':');
  if(p[0]==='tmdb')location.hash='tmdb/'+p[1]+'/'+p[2];
  else location.hash='detail/'+p[1];
}
function card(x){
  var mine=personalScore(x);
  return '<article class="card" data-open="'+h(openCode(x))+'"><div class="poster" style="--poster:'+x.poster+'"><span class="letter">'+h(x.title[0]||'S')+'</span><span class="tag">'+h(x.type)+'</span><div class="meta"><b>'+h(x.title)+'</b><span>'+h(x.year)+' · '+h(x.genre||'')+'</span></div></div><div class="scores"><span>TMDB <b>'+publicScore(x.public)+'</b></span><span>Ben <b>'+(mine==null?'—':mine.toFixed(1))+'</b></span></div></article>'
}
function section(title,sub,items,id){
  return '<section><div class="head"><div><h2>'+h(title)+'</h2><div class="muted">'+h(sub)+'</div></div></div><div class="grid"'+(id?' id="'+id+'"':'')+'>'+items.map(card).join('')+'</div></section>'
}
function home(){
  var diffs=fallbackCatalogue.slice().sort(function(a,b){return Math.abs((personalScore(b)||0)-b.public)-Math.abs((personalScore(a)||0)-a.public)}).slice(0,4);
  return '<div class="hero"><div class="box copy"><div class="eyebrow">✦ İzleme zevkinin haritası</div><h1>Ne izlediğini değil, <span>nasıl sevdiğini</span> gör.</h1><p>Dizi ve filmleri puanla, bölüm bölüm takip et ve kendi zevk profilini genel izleyiciyle karşılaştır.</p><div class="search"><input id="q" placeholder="Dizi veya film ara…"><button id="searchBtn">Ara</button></div><div id="searchResults" class="searchResults"></div><div id="tmdbStatus" class="tmdbNote">TMDB bağlantısı kontrol ediliyor…</div></div><aside class="box taste"><div><div class="muted">ZEHİRK UYUM PROFİLİ</div><strong>82<small>/100</small></strong><div class="bar"><i></i></div></div><p class="muted">Bu skor ileride gerçek puan geçmişinden otomatik hesaplanacak.</p></aside></div>'+
  section('Bu hafta öne çıkanlar','TMDB haftalık popüler verileri yükleniyor',fallbackCatalogue.slice(0,5),'trendingGrid')+
  '<section><div class="head"><div><h2>Profil özeti</h2><div class="muted">Kişisel verilerinden hesaplanan özet</div></div></div>'+profileStats()+'</section>'+
  '<section class="split"><div class="panel"><h3>Genel izleyiciyle en çok ayrıştıkların</h3><div class="rows">'+diffs.map(function(x){var mine=personalScore(x)||0;var d=mine-x.public;return '<div class="row" data-open="'+h(openCode(x))+'"><span><b>'+h(x.title)+'</b><br><small class="muted">TMDB '+publicScore(x.public)+' · Sen '+mine.toFixed(1)+'</small></span><span class="delta '+(d<0?'neg':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</span></div>'}).join('')+'</div></div><div class="panel"><h3>Seyir kimliğin</h3><p class="muted">Puan verdikçe tür, dönem, yönetmen ve oyuncu tercihlerinden kişisel zevk profilin oluşacak.</p></div></section>'
}
function profileStats(){
  var vals=Object.keys(saved.ratings).map(function(k){return Number(saved.ratings[k])}).filter(function(n){return isFinite(n)});
  var avg=vals.length?(vals.reduce(function(a,b){return a+b},0)/vals.length).toFixed(1):'—';
  return '<div class="stats"><div class="stat"><strong>'+vals.length+'</strong><span class="muted">Puanlanan yapım</span></div><div class="stat"><strong>'+saved.favorites.length+'</strong><span class="muted">Favori</span></div><div class="stat"><strong>'+saved.watchlist.length+'</strong><span class="muted">İzleme listesi</span></div><div class="stat"><strong>'+avg+'</strong><span class="muted">Puan ortalaması</span></div></div>'
}
function cataloguePage(type){
  var items=fallbackCatalogue.filter(function(x){return x.type===type});
  return '<div class="eyebrow">'+(type==='Dizi'?'Bölüm bölüm analiz':'Film günlüğün')+'</div><h1 style="font-size:44px;margin:8px 0">'+type+'ler</h1><p class="muted">Arama alanından TMDB kataloğundaki gerçek yapımlara ulaşabilirsin.</p>'+section(type+' örnekleri','TMDB bağlanana kadar gösterilen başlangıç verileri',items)
}
function listItems(keys){return keys.map(getItem).filter(Boolean)}
function lists(){
  return '<div class="eyebrow">Kişisel arşiv</div><h1>Listelerim</h1>'+
  section('Favorilerim','Tekrar dönmek isteyeceğin yapımlar',listItems(saved.favorites))+
  section('İzleme listem','Sırada bekleyenler',listItems(saved.watchlist))
}
function profile(){
  var rated=Object.keys(saved.ratings).map(getItem).filter(Boolean);
  var diffs=rated.slice().sort(function(a,b){return Math.abs(Number(saved.ratings[b.key])-b.public)-Math.abs(Number(saved.ratings[a.key])-a.public)}).slice(0,5);
  return '<div class="box" style="padding:24px"><div class="profileHero"><div class="avatar">G</div><div><h1 style="margin:0">Seyir profilin</h1><p class="muted">İzleme zevkini sayılara dönüştüren kişisel alan.</p></div></div></div><section>'+profileStats()+'</section><section class="split"><div class="panel"><h3>En çok ayrıştıkların</h3><div class="rows">'+(diffs.length?diffs.map(function(x){var d=Number(saved.ratings[x.key])-Number(x.public||0);return '<div class="row" data-open="'+h(openCode(x))+'"><span>'+h(x.title)+'</span><b class="delta '+(d<0?'neg':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</b></div>'}).join(''):'<p class="muted">Gerçek puanlar verdikçe burada kişisel farkların görünecek.</p>')+'</div></div><div class="panel"><h3>Sıradaki profil analizleri</h3><p class="muted">Favori türlerin, en sevdiğin yönetmenler ve oyuncular, yıllara göre puan eğilimin ve arkadaşlarla zevk uyumu burada hesaplanacak.</p></div></section>'
}
function chart(data){
  if(!data.length)return '<div class="loading">Bu sezon için bölüm verisi yok.</div>';
  var w=700,hgt=220,p=28;
  function y(v){return hgt-p-(Math.max(0,Math.min(10,Number(v||0)))/10)*(hgt-2*p)}
  function pointX(i){return p+i*(w-2*p)/(Math.max(1,data.length-1))}
  function path(idx){
    var pts=[];
    data.forEach(function(e,i){var v=e[idx];if(v!=null&&Number(v)>0)pts.push((pts.length?'L':'M')+pointX(i)+' '+y(v))});
    return pts.join(' ')
  }
  var dots=data.map(function(e,i){return e[3]!=null?'<circle cx="'+pointX(i)+'" cy="'+y(e[3])+'" r="3.5" fill="#8a7dff"/>':''}).join('');
  return '<svg viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none"><line x1="'+p+'" y1="'+y(5)+'" x2="'+(w-p)+'" y2="'+y(5)+'" stroke="#2d3442"/><path d="'+path(2)+'" fill="none" stroke="#ffc85a" stroke-width="3"/><path d="'+path(3)+'" fill="none" stroke="#8a7dff" stroke-width="3"/>'+dots+'</svg>'
}
function localDetail(id){
  var x=fallbackCatalogue.find(function(a){return a.key===id});
  if(!x)return home();
  currentItem=x;
  var eps=fallbackEpisodes[id]||[];
  return detailShell(x,'',eps)
}
function detailShell(x,extra,eps){
  var mine=personalScore(x);
  var sliderValue=mine==null?5:mine;
  var body='<div class="detail"><div class="detailposter" style="--poster:'+x.poster+'" data-letter="'+h(x.title[0]||'S')+'"></div><div><div class="eyebrow">'+h(x.type)+' · '+h(x.genre||'')+'</div><h1>'+h(x.title)+'</h1><div class="muted">'+h(x.year)+'</div>'+extra+'<div class="bigscore"><div class="scorebox"><span class="muted">TMDB puanı</span><strong style="color:#ffc85a">'+publicScore(x.public)+'</strong></div><div class="scorebox"><span class="muted">Benim puanım</span><strong id="mineScore" style="color:#a89fff">'+(mine==null?'—':mine.toFixed(1))+'</strong></div></div><div class="slider"><input id="ratingSlider" type="range" min="1" max="10" step=".1" value="'+sliderValue+'"></div><div class="actions"><button class="primary" id="saveRating">Puanı kaydet</button><button class="secondary" data-fav="'+h(x.key)+'">'+(saved.favorites.indexOf(x.key)>-1?'♥ Favorilerde':'♡ Favoriye ekle')+'</button><button class="secondary" data-watch="'+h(x.key)+'">'+(saved.watchlist.indexOf(x.key)>-1?'✓ Listemde':'＋ İzleme listesi')+'</button></div></div></div>';
  if(x.type==='Dizi'&&eps){
    body+='<section class="split"><div class="panel"><h3>Bölüm puan grafiği</h3><div class="muted" style="margin-bottom:8px">Sarı: TMDB · Mor: sen</div><div class="chart">'+chart(eps)+'</div></div><div class="panel"><h3>1. sezon bölümleri</h3><div class="episodes">'+eps.map(function(e){return '<div class="ep"><span class="muted">'+h(e[0])+'</span><b>'+h(e[1])+'</b><span style="color:#ffc85a">'+publicScore(e[2])+'</span><span class="mineep" style="color:#a89fff">'+(e[3]==null?'—':Number(e[3]).toFixed(1))+'</span></div>'}).join('')+'</div></div></section>'
  }
  return body
}
function remoteLoading(){return '<div class="loading">TMDB verileri yükleniyor…</div>'}
function route(){
  var hash=location.hash.replace('#','');
  if(hash.indexOf('detail/')===0)return localDetail(hash.split('/')[1]);
  if(hash.indexOf('tmdb/')===0)return remoteLoading();
  if(hash==='series')return cataloguePage('Dizi');
  if(hash==='movies')return cataloguePage('Film');
  if(hash==='lists')return lists();
  if(hash==='profile')return profile();
  return home()
}
function render(){
  document.getElementById('app').innerHTML=route();
  var base=location.hash.replace('#','').split('/')[0]||'home';
  document.querySelectorAll('[data-route]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-route')===base)});
  bind();
  if(base==='home')loadHomeRemote();
  if(base==='tmdb'){
    var p=location.hash.replace('#','').split('/');
    loadTmdbDetail(p[1],p[2]);
  }
}
function bind(){
  document.querySelectorAll('[data-route]').forEach(function(b){b.onclick=function(){var r=b.getAttribute('data-route');location.hash=r==='home'?'':r}});
  bindOpeners();
  var sb=document.getElementById('searchBtn');
  if(sb)sb.onclick=search;
  var q=document.getElementById('q');
  if(q)q.onkeydown=function(e){if(e.key==='Enter')search()}
  if(currentItem)bindPersonalControls(currentItem);
}
function bindOpeners(){
  document.querySelectorAll('[data-open]').forEach(function(el){el.onclick=function(){openFromCode(el.getAttribute('data-open'))}});
}
function bindPersonalControls(x){
  var slider=document.getElementById('ratingSlider');
  if(slider){
    slider.oninput=function(){document.getElementById('mineScore').textContent=Number(slider.value).toFixed(1)};
    var save=document.getElementById('saveRating');
    if(save)save.onclick=function(){
      saved.ratings[x.key]=Number(slider.value);
      rememberItem(x);persist();render()
    }
  }
  document.querySelectorAll('[data-fav]').forEach(function(b){b.onclick=function(){
    var key=b.getAttribute('data-fav'),i=saved.favorites.indexOf(key);
    if(i>-1)saved.favorites.splice(i,1);else saved.favorites.push(key);
    rememberItem(x);persist();render()
  }});
  document.querySelectorAll('[data-watch]').forEach(function(b){b.onclick=function(){
    var key=b.getAttribute('data-watch'),i=saved.watchlist.indexOf(key);
    if(i>-1)saved.watchlist.splice(i,1);else saved.watchlist.push(key);
    rememberItem(x);persist();render()
  }})
}
async function loadHomeRemote(){
  var status=document.getElementById('tmdbStatus');
  try{
    var st=await api({action:'status'});
    if(status)status.textContent=st.configured?'✓ TMDB bağlı — arama gerçek katalogda çalışıyor.':'TMDB anahtarı henüz eklenmedi; örnek katalog gösteriliyor.';
    if(!st.configured)return;
    var data=await api({action:'trending'});
    var items=(data.results||[]).slice(0,10).map(tmdbToItem);
    var grid=document.getElementById('trendingGrid');
    if(grid&&items.length){grid.innerHTML=items.map(card).join('');bindOpeners()}
  }catch(err){
    if(status)status.textContent='TMDB şu an kullanılamıyor; örnek verilerle devam ediliyor.'
  }
}
async function search(){
  var input=document.getElementById('q');
  var box=document.getElementById('searchResults');
  var q=(input.value||'').trim();
  if(q.length<2){box.innerHTML='<div class="muted">En az 2 karakter yaz.</div>';return}
  box.innerHTML='<div class="muted">Aranıyor…</div>';
  try{
    var data=await api({action:'search',q:q});
    var items=(data.results||[]).slice(0,10).map(tmdbToItem);
    box.innerHTML=items.length?items.map(function(x){return '<div class="searchItem" data-open="'+h(openCode(x))+'"><b>'+h(x.title)+'</b> <span class="muted">· '+h(x.type)+' · '+h(x.year)+' · TMDB '+publicScore(x.public)+'</span></div>'}).join(''):'<div class="muted">Sonuç bulunamadı.</div>';
    bindOpeners()
  }catch(err){
    var low=q.toLocaleLowerCase('tr-TR');
    var hits=fallbackCatalogue.filter(function(x){return x.title.toLocaleLowerCase('tr-TR').indexOf(low)>-1||x.genre.toLocaleLowerCase('tr-TR').indexOf(low)>-1});
    box.innerHTML='<div class="notice">TMDB henüz bağlı değil. Şimdilik örnek katalogda arandı.</div>'+hits.map(function(x){return '<div class="searchItem" data-open="'+h(openCode(x))+'"><b>'+h(x.title)+'</b> <span class="muted">· '+h(x.type)+' · '+h(x.genre)+'</span></div>'}).join('');
    bindOpeners()
  }
}
async function loadTmdbDetail(type,id){
  var app=document.getElementById('app');
  try{
    var d=await api({action:'details',type:type,id:id});
    var x=tmdbToItem(Object.assign({},d,{media_type:type}));
    x.genre=(d.genres||[]).map(function(g){return g.name}).slice(0,3).join(' · ')||'';
    currentItem=x;
    var overview=d.overview?'<p class="overview">'+h(d.overview)+'</p>':'';
    var director='';
    if(type==='movie'&&d.credits&&d.credits.crew){
      var dir=d.credits.crew.find(function(c){return c.job==='Director'});
      if(dir)director='<span class="creditChip">Yönetmen: '+h(dir.name)+'</span>'
    }
    var cast=(d.credits&&d.credits.cast?d.credits.cast.slice(0,5):[]).map(function(c){return '<span class="creditChip">'+h(c.name)+'</span>'}).join('');
    var credits=(director||cast)?'<div class="creditList">'+director+cast+'</div>':'';
    app.innerHTML=detailShell(x,overview+credits,null);
    if(type==='tv'){
      var count=Math.max(1,Number(d.number_of_seasons||1));
      var options='';
      for(var i=1;i<=count;i++)options+='<option value="'+i+'">'+i+'. sezon</option>';
      app.innerHTML+='<section class="panel"><div class="head"><div><h2>Bölüm analizi</h2><div class="muted">Her bölüm için TMDB puanı ve senin puanın</div></div></div><div class="seasonToolbar"><select id="seasonSelect" class="seasonSelect">'+options+'</select></div><div id="seasonArea" class="loading">Sezon yükleniyor…</div></section>';
    }else{
      var log=saved.movieLogs[x.key]||{rewatches:0,note:''};
      app.innerHTML+='<section class="panel"><h3>Film günlüğüm</h3><div class="split"><div><label class="muted">Kaç kez izledin?</label><input id="rewatches" class="fieldInput" type="number" min="0" max="99" value="'+Number(log.rewatches||0)+'"></div><div><label class="muted">Kısa notun</label><textarea id="movieNote" placeholder="Bu film sende ne bıraktı?">'+h(log.note||'')+'</textarea></div></div><div class="actions"><button id="saveMovieLog" class="primary">Günlüğü kaydet</button></div></section>'
    }
    bindPersonalControls(x);
    bindOpeners();
    if(type==='tv'){
      var select=document.getElementById('seasonSelect');
      select.onchange=function(){loadSeason(x,Number(select.value))};
      loadSeason(x,1)
    }else{
      document.getElementById('saveMovieLog').onclick=function(){
        saved.movieLogs[x.key]={rewatches:Number(document.getElementById('rewatches').value||0),note:document.getElementById('movieNote').value||''};
        rememberItem(x);persist();
        document.getElementById('saveMovieLog').textContent='Kaydedildi ✓'
      }
    }
  }catch(err){
    app.innerHTML='<div class="notice">TMDB verisi alınamadı. Vercel üzerinde TMDB_API_KEY eklenmiş olmalı.</div>'
  }
}
async function loadSeason(x,season){
  var area=document.getElementById('seasonArea');
  if(!area)return;
  area.className='loading';area.innerHTML='Sezon yükleniyor…';
  try{
    var d=await api({action:'season',type:'tv',id:x.tmdbId,season:season});
    var rows=(d.episodes||[]).map(function(ep){
      var epKey=x.key+'-s'+season+'e'+ep.episode_number;
      var mine=saved.episodeRatings[epKey];
      return ['S'+season+'B'+ep.episode_number,ep.name||('Bölüm '+ep.episode_number),Number(ep.vote_average||0),mine!=null?Number(mine):null,epKey]
    });
    area.className='';
    area.innerHTML='<div class="split"><div><div class="chart">'+chart(rows)+'</div><div class="tmdbNote">Sarı: TMDB bölüm puanı · Mor: senin verdiğin bölüm puanı</div></div><div class="episodes">'+rows.map(function(e){return '<div class="ep"><span class="muted">'+h(e[0])+'</span><b>'+h(e[1])+'</b><span style="color:#ffc85a">'+publicScore(e[2])+'</span><input class="episodeRating" data-ep="'+h(e[4])+'" type="number" min="1" max="10" step=".1" placeholder="—" value="'+(e[3]==null?'':e[3].toFixed(1))+'"></div>'}).join('')+'</div></div>';
    document.querySelectorAll('[data-ep]').forEach(function(inp){inp.onchange=function(){
      var v=Number(inp.value);
      if(v>=1&&v<=10)saved.episodeRatings[inp.getAttribute('data-ep')]=v;
      else delete saved.episodeRatings[inp.getAttribute('data-ep')];
      rememberItem(x);persist();loadSeason(x,season)
    }})
  }catch(err){
    area.className='notice';area.textContent='Sezon verileri alınamadı.'
  }
}
window.onhashchange=function(){currentItem=null;render()};
render();
</script>
