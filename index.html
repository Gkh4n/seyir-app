<script>
var saved=JSON.parse(localStorage.getItem('seyir-state')||'null')||{};
if(!saved.ratings)saved.ratings={};
if(!saved.favorites)saved.favorites=[];
if(!saved.watchlist)saved.watchlist=[];
if(!saved.items)saved.items={};
if(!saved.episodeRatings)saved.episodeRatings={};
if(!saved.movieLogs)saved.movieLogs={};
if(!saved.dataVersion||saved.dataVersion<4){
  var demoKeys=['dark','dexter','lost','supernatural','prisonbreak','interstellar','prestige','inception','parasite','shutter'];
  demoKeys.forEach(function(key){
    delete saved.ratings[key];
    delete saved.items[key];
    delete saved.movieLogs[key];
    saved.favorites=saved.favorites.filter(function(k){return k!==key});
    saved.watchlist=saved.watchlist.filter(function(k){return k!==key});
  });
  Object.keys(saved.episodeRatings).forEach(function(key){
    if(demoKeys.some(function(d){return key.indexOf(d+'-')===0}))delete saved.episodeRatings[key]
  });
  Object.keys(saved.items).forEach(function(key){
    if(saved.items[key]&&saved.items[key].genre==='TMDB')saved.items[key].genre='';
  });
  saved.dataVersion=4;
  localStorage.setItem('seyir-state',JSON.stringify(saved));
}

var currentItem=null;
var activeListTab='favorites';
var catalogGenres={tv:'all',movie:'all',anime:'all'};
var searchTimer=null;
var searchSeq=0;
var currentMatrixData=[];
var currentMatrixItem=null;
var currentMatrixMode='public';
var pendingEpisodeRatings={};
var episodeRatingMode='stars';
var activeRatingSeason=1;
var seasonDataCache={};

function persist(){localStorage.setItem('seyir-state',JSON.stringify(saved))}
function h(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function publicScore(v){var n=Number(v||0);return n>0?n.toFixed(1):'—'}
function formatVotes(v){var n=Number(v||0);return n>0?n.toLocaleString('tr-TR')+' oy':'Oy bilgisi yok'}
function seriesYearRange(d){
  var start=(d.first_air_date||'').slice(0,4);
  var end=(d.last_air_date||'').slice(0,4);
  if(!start)return '—';
  var ongoing=d.in_production===true||['Returning Series','In Production','Planned'].indexOf(d.status)>-1;
  if(ongoing)return start+'–Günümüz';
  if(end&&end!==start)return start+'–'+end;
  return start
}
function personalScore(x){if(saved.ratings[x.key]!=null)return Number(saved.ratings[x.key]);if(x.source==='local'&&x.mine!=null)return Number(x.mine);return null}
function posterValue(path,title){
  if(path)return "linear-gradient(transparent 35%,rgba(5,7,11,.96)),url('https://image.tmdb.org/t/p/w500"+path+"') center/cover";
  var ch=(title||'S').charCodeAt(0)%5;
  var colors=['#263c59','#47365f','#5a382d','#29504c','#514b2f'];
  return 'linear-gradient(145deg,'+colors[ch]+',#171b23 58%,#090b10)';
}
function mediaLabel(type){return type==='tv'?'Dizi':'Film'}
function tmdbToItem(r){
  var mt=r.media_type||(r.number_of_seasons!=null?'tv':'movie');
  var title=r.title||r.name||'İsimsiz';
  var date=r.release_date||r.first_air_date||'';
  return {
    key:'tmdb-'+mt+'-'+r.id,
    source:'tmdb',
    tmdbId:r.id,
    mediaType:mt,
    type:mediaLabel(mt),
    title:title,
    year:date?date.slice(0,4):'—',
    genre:'',
    public:Number(r.vote_average||0),
    voteCount:Number(r.vote_count||0),
    poster:posterValue(r.poster_path,title),
    posterPath:r.poster_path||null,
    backdropPath:r.backdrop_path||null
  };
}
function rememberItem(x){
  if(x&&x.source==='tmdb'){
    saved.items[x.key]={
      key:x.key,source:'tmdb',tmdbId:x.tmdbId,mediaType:x.mediaType,type:x.type,title:x.title,
      year:x.year,genre:x.genre,public:x.public,voteCount:Number(x.voteCount||0),poster:x.poster,posterPath:x.posterPath||null,backdropPath:x.backdropPath||null
    };
    persist();
  }
}
function getItem(key){return saved.items[key]||null}
async function api(params){
  var qs=new URLSearchParams(params);
  var res=await fetch('/api/tmdb?'+qs.toString());
  var data=await res.json().catch(function(){return {}});
  if(!res.ok)throw new Error(data.error||'API isteği başarısız');
  return data;
}
function openCode(x){return 'tmdb:'+x.mediaType+':'+x.tmdbId}
function openFromCode(code){
  var p=code.split(':');
  if(p[0]==='tmdb')location.hash='tmdb/'+p[1]+'/'+p[2];
}
function card(x){
  var mine=personalScore(x);
  return '<article class="card" data-open="'+h(openCode(x))+'"><div class="poster" style="--poster:'+x.poster+'"><span class="letter">'+h(x.title[0]||'S')+'</span><span class="tag">'+h(x.type)+'</span><div class="meta"><b>'+h(x.title)+'</b><span>'+h(x.year)+(x.genre?' · '+h(x.genre):'')+'</span></div></div><div class="scores"><span>Genel <b>'+publicScore(x.public)+'</b></span><span>Ben <b>'+(mine==null?'—':mine.toFixed(1))+'</b></span></div></article>'
}
function section(title,sub,items,id){
  return '<section><div class="head"><div><h2>'+h(title)+'</h2><div class="muted">'+h(sub)+'</div></div></div><div class="grid"'+(id?' id="'+id+'"':'')+'>'+items.map(card).join('')+'</div></section>'
}
function home(){
  var rated=ratedItems();
  var diffs=rated.slice().filter(function(x){return Number(x.public)>0}).sort(function(a,b){
    return Math.abs(Number(saved.ratings[b.key])-Number(b.public||0))-Math.abs(Number(saved.ratings[a.key])-Number(a.public||0))
  }).slice(0,4);
  var ratingVals=Object.keys(saved.ratings).map(function(k){return Number(saved.ratings[k])}).filter(function(v){return isFinite(v)});
  var avg=ratingVals.length?ratingVals.reduce(function(a,b){return a+b},0)/ratingVals.length:0;
  var top=rated[0]||null;
  return '<div class="hero"><div class="homeHeroMain"><div class="eyebrow">✦ İzleme zevkinin haritası</div><h1>İzlediklerini değil,<br><span>zevkini keşfet.</span></h1><p>Dizi, film ve animeleri puanla; bölüm bölüm takip et. Zamanla sana ait gerçek bir seyir profili oluşsun.</p><div class="homeSearch"><input id="q" placeholder="Dizi, film veya anime ara…"><button id="searchBtn">Ara</button></div><div id="searchResults" class="searchResults"></div><div class="homeQuick"><button data-route="series">Dizileri keşfet</button><button data-route="movies">Filmleri keşfet</button><button data-route="anime">Animelere göz at</button></div><div class="homeProfileStrip"><div class="homeMiniStat"><span>Puanladıkların</span><b>'+ratingVals.length+'</b></div><div class="homeMiniStat"><span>Puan ortalaman</span><b>'+(ratingVals.length?avg.toFixed(1):'—')+'</b></div><div class="homeMiniStat"><span>En yüksek puanın</span><b>'+(top?Number(saved.ratings[top.key]).toFixed(1):'—')+'</b></div></div><div id="tmdbStatus" class="homeStatus">Katalog hazırlanıyor…</div></div><aside id="homeSpotlight" class="homeSpotlight"><div class="loading" style="margin:18px">Öne çıkan yapım yükleniyor…</div></aside></div>'+
  '<section class="homeSection"><div class="head"><div><div class="eyebrow">Şu an konuşulanlar</div><h2>Bu hafta öne çıkanlar</h2><div class="muted">Güncel popüler yapımlar arasından seçtiklerimiz</div></div></div><div id="trendingGrid" class="grid"><div class="loading" style="grid-column:1/-1">Yükleniyor…</div></div></section>'+
  '<section class="homeSection"><div class="head"><div><div class="eyebrow">Sana ait</div><h2>Seyir profilin</h2><div class="muted">Puanların ve listelerinden canlı olarak hesaplanır</div></div></div>'+profileStats()+'</section>'+
  '<section class="split homeSection"><div class="homeInsightPanel"><div class="eyebrow">Farklı düşündüklerin</div><h3>Genel izleyiciyle en çok ayrıştıkların</h3><div class="rows">'+(diffs.length?diffs.map(function(x){var mine=Number(saved.ratings[x.key]);var d=mine-Number(x.public||0);return '<div class="row" data-open="'+h(openCode(x))+'"><span><b>'+h(x.title)+'</b><br><small class="muted">Genel '+publicScore(x.public)+' · Sen '+mine.toFixed(1)+'</small></span><span class="delta '+(d<0?'neg':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</span></div>'}).join(''):'<p class="muted">Birkaç yapıma puan verdiğinde burada genel izleyiciden en çok ayrıştığın seçimler görünecek.</p>')+'</div></div><div class="homeInsightPanel"><div class="eyebrow">Zamanla şekillenir</div><h3>Seyir kimliğin</h3><p class="muted">Tür, dönem, oyuncu ve yönetmen tercihlerin; verdiğin puanlarla birlikte kişisel zevk profilini oluşturacak.</p><div class="actions"><button class="secondary" data-route="profile">Profilimi aç</button><button class="secondary" data-route="lists">Listelerime git</button></div></div></section>'
}
function profileStats(){
  var vals=Object.keys(saved.ratings).map(function(k){return Number(saved.ratings[k])}).filter(function(n){return isFinite(n)});
  var avg=vals.length?(vals.reduce(function(a,b){return a+b},0)/vals.length).toFixed(1):'—';
  return '<div class="stats"><div class="stat"><strong>'+vals.length+'</strong><span class="muted">Puanlanan yapım</span></div><div class="stat"><strong>'+saved.favorites.length+'</strong><span class="muted">Favori</span></div><div class="stat"><strong>'+saved.watchlist.length+'</strong><span class="muted">İzleme listesi</span></div><div class="stat"><strong>'+avg+'</strong><span class="muted">Puan ortalaması</span></div></div>'
}
function catalogueGenresFor(kind){
  return {
    tv:[
      ['all','Tümü'],['action','Aksiyon & Macera'],['drama','Dram'],['comedy','Komedi'],['crime','Suç'],['mystery','Gizem'],['scifi','Bilim Kurgu & Fantastik'],['documentary','Belgesel']
    ],
    movie:[
      ['all','Tümü'],['action','Aksiyon'],['adventure','Macera'],['comedy','Komedi'],['drama','Dram'],['horror','Korku'],['thriller','Gerilim'],['scifi','Bilim Kurgu'],['romance','Romantik'],['mystery','Gizem']
    ],
    anime:[
      ['all','Tümü'],['action','Aksiyon'],['adventure','Macera'],['comedy','Komedi'],['drama','Dram'],['mystery','Gizem'],['scifi','Bilim Kurgu & Fantastik'],['family','Aile']
    ]
  }[kind]||[];
}
function catalogueGenreLabel(kind,key){
  var hit=catalogueGenresFor(kind).find(function(x){return x[0]===key});
  return hit?hit[1]:'Tümü'
}
function catalogueCategoryHtml(kind){
  var active=catalogGenres[kind]||'all';
  return '<div class="catalogCategories">'+catalogueGenresFor(kind).map(function(g){
    return '<button class="catalogCategory '+(g[0]===active?'active':'')+'" data-catalog-genre="'+g[0]+'">'+h(g[1])+'</button>'
  }).join('')+'</div>'
}
function cataloguePage(kind){
  var cfg={
    tv:{eyebrow:'Bölüm bölüm analiz',title:'Diziler',desc:'Gerçek dizi kataloğunu keşfet.',placeholder:'Dizi ara…',heading:'Diziler'},
    movie:{eyebrow:'Film günlüğün',title:'Filmler',desc:'Gerçek film kataloğunu keşfet.',placeholder:'Film ara…',heading:'Filmler'},
    anime:{eyebrow:'Anime dünyası',title:'Animeler',desc:'Japon anime dizi ve filmlerini tek yerde keşfet.',placeholder:'Anime ara…',heading:'Animeler'}
  }[kind];
  var active=catalogGenres[kind]||'all';
  var heading=active==='all'?'Popüler '+cfg.heading:catalogueGenreLabel(kind,active)+' '+cfg.heading;
  return '<div class="eyebrow">'+cfg.eyebrow+'</div><h1 style="font-size:44px;margin:8px 0">'+cfg.title+'</h1><p class="muted">'+cfg.desc+'</p>'+catalogueCategoryHtml(kind)+'<div class="catalogSearch"><input id="catalogQ" placeholder="'+cfg.placeholder+'"><button id="catalogSearchBtn">Ara</button></div><div id="catalogSearchResults" class="catalogSearchResults"></div><div class="catalogHint">Arama seçili kategori içinde yapılır.</div><section><div class="head"><div><h2 id="catalogHeading">'+h(heading)+'</h2><div class="muted">Güncel katalog</div></div></div><div id="catalogGrid" class="grid"><div class="loading" style="grid-column:1/-1">Yükleniyor…</div></div></section><div id="catalogMeta" class="tmdbNote"></div>'
}
function listItems(keys){return keys.map(getItem).filter(Boolean)}
function ratedItems(){
  return Object.keys(saved.ratings).map(function(key){return getItem(key)}).filter(Boolean).sort(function(a,b){return Number(saved.ratings[b.key]||0)-Number(saved.ratings[a.key]||0)})
}
function listTabItems(tab){
  if(tab==='watchlist')return listItems(saved.watchlist);
  if(tab==='rated')return ratedItems();
  return listItems(saved.favorites)
}
function listGridHtml(tab){
  var items=listTabItems(tab);
  if(!items.length){
    var msg=tab==='favorites'?'Henüz favori eklemedin.':tab==='watchlist'?'İzleme listen şu an boş.':'Henüz hiçbir yapıma kendi puanını vermedin.';
    return '<div class="emptyState">'+msg+'<br><small>Keşfet, Dizi, Film veya Anime sekmesinden içerik ekleyebilirsin.</small></div>'
  }
  return items.map(card).join('')
}
function lists(){
  var ratedCount=Object.keys(saved.ratings).length;
  return '<div class="listHero"><div><div class="eyebrow">Kişisel arşiv</div><h1 style="font-size:44px;margin:8px 0 4px">Listelerim</h1><p class="muted">Kaydettiklerini, favorilerini ve puanladığın yapımları tek yerde yönet.</p></div></div>'+
  '<div class="listTabs"><button class="listTab '+(activeListTab==='favorites'?'active':'')+'" data-list-tab="favorites">♥ Favoriler <span class="listCount">'+saved.favorites.length+'</span></button><button class="listTab '+(activeListTab==='watchlist'?'active':'')+'" data-list-tab="watchlist">＋ İzleme Listesi <span class="listCount">'+saved.watchlist.length+'</span></button><button class="listTab '+(activeListTab==='rated'?'active':'')+'" data-list-tab="rated">★ Puanladıklarım <span class="listCount">'+ratedCount+'</span></button></div>'+
  '<section style="margin-top:18px"><div id="listGrid" class="grid">'+listGridHtml(activeListTab)+'</div></section>'
}
function profile(){
  var rated=ratedItems();
  var ratingVals=Object.keys(saved.ratings).map(function(k){return Number(saved.ratings[k])}).filter(function(v){return isFinite(v)});
  var avg=ratingVals.length?ratingVals.reduce(function(a,b){return a+b},0)/ratingVals.length:0;
  var withPublic=rated.filter(function(x){return Number(x.public)>0});
  var publicAvg=withPublic.length?withPublic.reduce(function(s,x){return s+Number(x.public)},0)/withPublic.length:0;
  var bias=withPublic.length?avg-publicAvg:0;
  var biasLabel=!withPublic.length?'Henüz hesaplanmadı':Math.abs(bias)<.2?'Genel izleyiciyle dengeli':bias>0?'Genel izleyiciden daha cömert':'Genel izleyiciden daha seçici';
  var top=rated[0]||null;
  var diffs=rated.slice().sort(function(a,b){return Math.abs(Number(saved.ratings[b.key])-Number(b.public||0))-Math.abs(Number(saved.ratings[a.key])-Number(a.public||0))}).slice(0,5);
  var typeCounts=rated.reduce(function(acc,x){acc[x.type]=(acc[x.type]||0)+1;return acc},{});
  var epCount=Object.keys(saved.episodeRatings).length;
  var loggedMovies=Object.keys(saved.movieLogs).length;
  var dist=[];
  for(var i=1;i<=10;i++){dist.push(ratingVals.filter(function(v){return Math.round(v)===i}).length)}
  var maxDist=Math.max.apply(null,dist.concat([1]));
  var bars=dist.map(function(n,i){return '<div class="ratingBar"><span>'+(i+1)+'</span><div class="ratingTrack"><div class="ratingFill" style="width:'+((n/maxDist)*100)+'%"></div></div><span>'+n+'</span></div>'}).join('');
  return '<div class="profileCover"><div class="profileTop"><div class="avatar">S</div><div class="profileMeta"><h1>Seyir profilin</h1><p>Puanların ve listelerinden oluşan gerçek kişisel özet.</p><div class="profileBadge">● Veriler şimdilik bu cihazda saklanıyor</div></div></div></div>'+
  '<section>'+profileStats()+'</section>'+
  '<section><div class="insightGrid"><div class="insightCard"><span>Puanlama tarzın</span><strong>'+h(biasLabel)+'</strong>'+(withPublic.length?'<small class="muted">'+(bias>=0?'+':'')+bias.toFixed(1)+' Genel farkı</small>':'')+'</div><div class="insightCard"><span>En yüksek puanın</span><strong>'+(top?h(top.title)+' · '+Number(saved.ratings[top.key]).toFixed(1):'—')+'</strong></div><div class="insightCard"><span>Bölüm puanların</span><strong>'+epCount+'</strong><small class="muted">'+loggedMovies+' film günlüğü kaydı</small></div></div></section>'+
  '<section class="split"><div class="panel"><h3>En çok ayrıştıkların</h3><div class="rows">'+(diffs.length?diffs.map(function(x){var d=Number(saved.ratings[x.key])-Number(x.public||0);return '<div class="row" data-open="'+h(openCode(x))+'"><span><b>'+h(x.title)+'</b><br><small class="muted">'+h(x.type)+' · Sen '+Number(saved.ratings[x.key]).toFixed(1)+' · Genel '+publicScore(x.public)+'</small></span><b class="delta '+(d<0?'neg':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</b></div>'}).join(''):'<p class="muted">Puan verdikçe genel izleyiciyle en çok ayrıştığın yapımlar burada görünecek.</p>')+'</div></div><div class="panel"><h3>Puan dağılımın</h3>'+(ratingVals.length?'<div class="ratingBars">'+bars+'</div>':'<p class="muted">Dağılımı görmek için birkaç yapıma puan ver.</p>')+'</div></section>'+
  '<section class="panel"><h3>Arşiv özeti</h3><div class="rows"><div class="row"><span>Puanladığın diziler</span><b>'+(typeCounts.Dizi||0)+'</b></div><div class="row"><span>Puanladığın filmler</span><b>'+(typeCounts.Film||0)+'</b></div><div class="row"><span>Favoriler</span><b>'+saved.favorites.length+'</b></div><div class="row"><span>İzleme listesi</span><b>'+saved.watchlist.length+'</b></div></div></section>'
}
function chart(data){
  if(!data.length)return '<div class="loading">Bu sezon için bölüm verisi yok.</div>';
  var w=700,hgt=220,p=28;
  function y(v){return hgt-p-(Math.max(0,Math.min(10,Number(v||0)))/10)*(hgt-2*p)}
  function pointX(i){return p+i*(w-2*p)/(Math.max(1,data.length-1))}
  function path(idx){
    var pts=[];
    data.forEach(function(e,i){var v=e[idx];if(v!=null&&Number(v)>0)pts.push((pts.length?'L':'M')+pointX(i)+' '+y(v))});
    return pts.join(' ')
  }
  var dots=data.map(function(e,i){return e[3]!=null?'<circle cx="'+pointX(i)+'" cy="'+y(e[3])+'" r="3.5" fill="#8a7dff"/>':''}).join('');
  return '<svg viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none"><line x1="'+p+'" y1="'+y(5)+'" x2="'+(w-p)+'" y2="'+y(5)+'" stroke="#2d3442"/><path d="'+path(2)+'" fill="none" stroke="#ffc85a" stroke-width="3"/><path d="'+path(3)+'" fill="none" stroke="#8a7dff" stroke-width="3"/>'+dots+'</svg>'
}

function remoteLoading(){return '<div class="loading">Genel verileri yükleniyor…</div>'}
function route(){
  var hash=location.hash.replace('#','');
  if(hash.indexOf('tmdb/')===0)return remoteLoading();
  if(hash==='series')return cataloguePage('tv');
  if(hash==='movies')return cataloguePage('movie');
  if(hash==='anime')return cataloguePage('anime');
  if(hash==='lists')return lists();
  if(hash==='profile')return profile();
  return home()
}
function render(){
  document.getElementById('app').innerHTML=route();
  var base=location.hash.replace('#','').split('/')[0]||'home';
  document.querySelectorAll('[data-route]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-route')===base)});
  bind();
  if(base==='home')loadHomeRemote();
  if(base==='series')loadCatalogue('tv');
  if(base==='movies')loadCatalogue('movie');
  if(base==='anime')loadCatalogue('anime');
  if(base==='tmdb'){
    var p=location.hash.replace('#','').split('/');
    loadTmdbDetail(p[1],p[2]);
  }
}
function bind(){
  document.querySelectorAll('[data-route]').forEach(function(b){b.onclick=function(){var r=b.getAttribute('data-route');location.hash=r==='home'?'':r}});
  bindOpeners();
  var sb=document.getElementById('searchBtn');
  if(sb)sb.onclick=search;
  var q=document.getElementById('q');
  if(q){
    q.onkeydown=function(e){if(e.key==='Enter'){clearTimeout(searchTimer);search()}};
    q.oninput=function(){
      clearTimeout(searchTimer);
      var value=(q.value||'').trim();

async function categorySearch(type,forcedQuery){
  var input=document.getElementById('catalogQ');
  var box=document.getElementById('catalogSearchResults');
  if(!box)return;
  var q=(forcedQuery!=null?forcedQuery:(input&&input.value||'')).trim();
  if(!q){box.innerHTML='';return}
  var mySeq=++searchSeq;
  box.innerHTML='<div class="muted">Aranıyor…</div>';
  try{
    var data=await api({action:'search',q:q,type:type,genre:catalogGenres[type]||'all'});
    if(mySeq!==searchSeq)return;
    var nq=normalizeText(q);
    var items=(data.results||[]).map(tmdbToItem).sort(function(a,b){
      var at=normalizeText(a.title),bt=normalizeText(b.title);
      var ae=at===nq?1:0,be=bt===nq?1:0;
      if(ae!==be)return be-ae;
      var as=at.indexOf(nq)===0?1:0,bs=bt.indexOf(nq)===0?1:0;
      if(as!==bs)return bs-as;
      return Number(b.public||0)-Number(a.public||0)
    }).slice(0,8);
    box.innerHTML=items.length?items.map(searchResultRow).join(''):'<div class="muted">Bu kategoride sonuç bulunamadı.</div>';
    bindOpeners()
  }catch(err){
    if(mySeq!==searchSeq)return;
    box.innerHTML='<div class="notice">Arama şu an kullanılamıyor.</div>'
  }
}

function scoreClass(v){
  var n=Number(v||0);
  if(!n)return 'empty';
  if(n>=9.5)return 's95';
  if(n>=9)return 's90';
  if(n>=8)return 's80';
  if(n>=7)return 's70';
  if(n>=6)return 's60';
  if(n>=5)return 's50';
  return 's00'
}
function episodeMine(x,season,episode){
  var key=x.key+'-s'+season+'e'+episode;
  return saved.episodeRatings[key]!=null?Number(saved.episodeRatings[key]):null
}
function getMatrixEpisode(season,episode){
  var s=currentMatrixData.find(function(x){return Number(x.season)===Number(season)});
  return s?(s.episodes||[]).find(function(e){return Number(e.episode_number)===Number(episode)}):null
}
function showEpisodeDetail(season,episode){

  var inp=document.getElementById('episodeDetailRating');
  if(inp)inp.onchange=function(){

    rememberItem(currentMatrixItem);persist();
    renderEpisodeMatrix();renderTopEpisodes();showEpisodeDetail(season,episode)
  }
}
function renderTopEpisodes(){

    return '<div class="topEpisode" data-top-season="'+item.season+'" data-top-episode="'+ep.episode_number+'"><div class="topEpisodeImg" style="--ep-img:'+img+'"></div><div class="topEpisodeInfo"><b>'+h(ep.name||('Bölüm '+ep.episode_number))+'</b><span>S'+item.season+'B'+ep.episode_number+' · '+formatVotes(ep.vote_count)+'</span></div><div class="topEpisodeScore">'+publicScore(item.score)+'</div></div>'

function renderEpisodeMatrix(){
  var area=document.getElementById('matrixArea');
  if(!area||!currentMatrixItem||!currentMatrixData.length)return;
  var seasons=currentMatrixData;
  var maxEpisodes=0;
  seasons.forEach(function(s){maxEpisodes=Math.max(maxEpisodes,(s.episodes||[]).length)});
  var shownEpisodes=Math.min(maxEpisodes,60);
  var head='<tr><th></th>'+seasons.map(function(s){return '<th>S'+s.season+'</th>'}).join('')+'</tr>';
  var rows='';
  for(var epNo=1;epNo<=shownEpisodes;epNo++){
    rows+='<tr><td>B'+epNo+'</td>';
    seasons.forEach(function(s){
      var ep=(s.episodes||[]).find(function(e){return Number(e.episode_number)===epNo});
      if(!ep){rows+='<td><div class="scoreCell empty">—</div></td>';return}
      var val=currentMatrixMode==='mine'?episodeMine(currentMatrixItem,s.season,epNo):Number(ep.vote_average||0);
      var label=val!=null&&Number(val)>0?Number(val).toFixed(1):'—';
      var title=(ep.name||('Bölüm '+epNo))+' · '+label;
      var votes=Number(ep.vote_count||0);
      rows+='<td><div class="scoreCell '+scoreClass(val)+'" data-matrix-season="'+s.season+'" data-matrix-episode="'+epNo+'" data-matrix-name="'+h(ep.name||('Bölüm '+epNo))+'" data-matrix-score="'+h(label)+'" data-matrix-votes="'+votes+'" title="'+h(title)+'">'+label+'</div></td>'
    });
    rows+='</tr>'
  }
  rows+='<tr><td class="avgCell">ORT.</td>';
  seasons.forEach(function(s){
    var vals=(s.episodes||[]).map(function(ep){return currentMatrixMode==='mine'?episodeMine(currentMatrixItem,s.season,ep.episode_number):Number(ep.vote_average||0)}).filter(function(v){return v!=null&&Number(v)>0});
    var avg=vals.length?vals.reduce(function(a,b){return a+Number(b)},0)/vals.length:0;
    rows+='<td><div class="scoreCell avgCell '+scoreClass(avg)+'">'+(avg?avg.toFixed(1):'—')+'</div></td>'
  });
  rows+='</tr>';
  var note=maxEpisodes>60?'<div class="matrixNote">Bu yapım çok uzun olduğu için haritada ilk 60 bölüm gösteriliyor; sezon ayrıntısından diğer bölümlere erişebilirsin.</div>':'';
  area.className='episodeMatrixWrap';
  area.innerHTML='<table class="episodeMatrix">'+head+rows+'</table>'+note;
  document.querySelectorAll('[data-matrix-season]').forEach(function(cell){cell.onclick=function(){
    var season=Number(cell.getAttribute('data-matrix-season'));
    var episode=Number(cell.getAttribute('data-matrix-episode'));
    showEpisodeDetail(season,episode);
    activeRatingSeason=season;
    var select=document.getElementById('seasonSelect');
    if(select)select.value=String(season);
    renderSeasonTabs(currentMatrixItem);
    loadSeason(currentMatrixItem,season)
  }});
  document.querySelectorAll('[data-matrix-mode]').forEach(function(btn){
    btn.classList.toggle('active',btn.getAttribute('data-matrix-mode')===currentMatrixMode);
    btn.onclick=function(){currentMatrixMode=btn.getAttribute('data-matrix-mode');renderEpisodeMatrix()}
  })
}
async function loadEpisodeMatrix(x,count){
  var area=document.getElementById('matrixArea');
  if(!area)return;
  currentMatrixItem=x;
  currentMatrixMode='public';
  currentMatrixData=[];
  area.className='loading';
  area.innerHTML='Bölüm puanları yükleniyor…';
  var limit=Math.min(Number(count||1),20);
  try{
    var jobs=[];
    for(var s=1;s<=limit;s++)jobs.push(api({action:'season',type:'tv',id:x.tmdbId,season:s}).then(function(d){return d}));
    var data=await Promise.all(jobs);
    currentMatrixData=data.map(function(d,i){return {season:i+1,episodes:d.episodes||[]}}).filter(function(s){return s.episodes.length});
    if(!currentMatrixData.length){area.className='emptyState';area.textContent='Bölüm puanı verisi bulunamadı.';return}
    renderEpisodeMatrix();
    renderTopEpisodes();
    renderSeasonTabs(x);
    document.querySelectorAll('[data-matrix-mode]').forEach(function(btn){btn.onclick=function(){
      currentMatrixMode=btn.getAttribute('data-matrix-mode');
      renderEpisodeMatrix()
    }})
  }catch(err){
    area.className='emptyState';
    area.textContent='Bölüm puanları şu an yüklenemedi.'
  }
}

function episodeRatingKey(x,season,episode){return x.key+'-s'+season+'e'+episode}
function currentEpisodeRating(x,season,episode){
  var key=episodeRatingKey(x,season,episode);
  if(Object.prototype.hasOwnProperty.call(pendingEpisodeRatings,key))return pendingEpisodeRatings[key];
  return saved.episodeRatings[key]!=null?Number(saved.episodeRatings[key]):null
}
function hasPendingEpisodeChanges(){return Object.keys(pendingEpisodeRatings).length>0}
function renderSeasonTabs(x){
  var tabs=document.getElementById('seasonTabs');
  if(!tabs||!currentMatrixData.length)return;
  tabs.innerHTML=currentMatrixData.map(function(s){
    var total=(s.episodes||[]).length;
    var rated=(s.episodes||[]).filter(function(ep){return currentEpisodeRating(x,s.season,ep.episode_number)!=null}).length;
    return '<button class="seasonTab '+(Number(s.season)===Number(activeRatingSeason)?'active':'')+'" data-season-tab="'+s.season+'">S'+s.season+' <small>'+rated+'/'+total+'</small></button>'
  }).join('');
  tabs.querySelectorAll('[data-season-tab]').forEach(function(btn){btn.onclick=function(){
    activeRatingSeason=Number(btn.getAttribute('data-season-tab'));
    var select=document.getElementById('seasonSelect');if(select)select.value=String(activeRatingSeason);
    renderSeasonTabs(x);loadSeason(x,activeRatingSeason)
  }})
}
function setEpisodeRatingPending(x,season,episode,value){
  var key=episodeRatingKey(x,season,episode);
  var original=saved.episodeRatings[key]!=null?Number(saved.episodeRatings[key]):null;
  if(value==null||value===''){
    if(original==null)delete pendingEpisodeRatings[key];else pendingEpisodeRatings[key]=null
  }else{
    var v=Number(value);
    if(!isFinite(v)||v<1||v>10)return;
    if(original!=null&&Math.abs(original-v)<.001)delete pendingEpisodeRatings[key];else pendingEpisodeRatings[key]=v
  }
  updateEpisodeSaveBar();
}
function updateEpisodeSaveBar(){
  var bar=document.getElementById('episodeSaveBar');
  var btn=document.getElementById('saveEpisodeRatings');
  var n=Object.keys(pendingEpisodeRatings).length;
  if(bar)bar.classList.toggle('hidden',n===0);
  if(btn)btn.disabled=false
}
function renderEpisodeRateControl(x,season,ep){
  var val=currentEpisodeRating(x,season,ep.episode_number);
  var key=h(episodeRatingKey(x,season,ep.episode_number));
  if(episodeRatingMode==='decimal'){
    return '<div class="decimalRate"><input data-decimal-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'" type="number" min="1" max="10" step=".1" placeholder="—" value="'+(val==null?'':Number(val).toFixed(1))+'"></div>'+(val!=null?'<button class="clearEpRating" data-clear-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'">Puanı kaldır</button>':'')
  }
  var stars='';
  for(var i=1;i<=10;i++)stars+='<button class="'+(val!=null&&i<=Math.round(Number(val))?'on':'')+'" data-star-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'" data-star="'+i+'" aria-label="'+i+' puan">★</button>';
  return '<div class="starRate star-'+scoreClass(val)+'">'+stars+'</div>'+(val!=null?'<button class="clearEpRating" data-clear-ep="'+key+'" data-season="'+season+'" data-episode="'+ep.episode_number+'">Puanı kaldır</button>':'')
}
function renderSeasonEditor(x,season,d){
  var area=document.getElementById('seasonArea');
  if(!area||!d)return;
  activeRatingSeason=Number(season||1);
  renderSeasonTabs(x);
  var episodes=d.episodes||[];
  area.className='';
  area.innerHTML='<div class="episodeRatingList">'+episodes.map(function(ep){
    var still=ep.still_path?"url('https://image.tmdb.org/t/p/w500"+ep.still_path+"') center/cover":"linear-gradient(135deg,#18202d,#0d1118)";
    return '<div class="episodeRatingRow"><div class="episodeNo">'+ep.episode_number+'</div><div class="episodeRaterMain"><div class="episodeRaterTop"><div class="episodeRaterTitle"><b>'+h(ep.name||('Bölüm '+ep.episode_number))+'</b><span>'+(ep.air_date?h(ep.air_date):'Tarih bilgisi yok')+'</span><div class="episodeGeneralMeta"><span>Genel <b>'+publicScore(ep.vote_average)+'</b></span><span>'+formatVotes(ep.vote_count)+'</span></div></div><div class="episodeRaterStill" style="--epstill:'+still+'"></div></div>'+(ep.overview?'<p class="episodeRaterOverview">'+h(ep.overview)+'</p>':'')+'</div><div class="episodeRateControl">'+renderEpisodeRateControl(x,activeRatingSeason,ep)+'</div></div>'
  }).join('')+'</div><div id="episodeSaveBar" class="episodeSaveBar hidden"><button id="saveEpisodeRatings" class="episodeSaveBtn">Değişiklikleri kaydet</button></div>';
  bindEpisodeRatingEditor(x,activeRatingSeason)
}
function bindEpisodeRatingEditor(x,season){
  document.querySelectorAll('[data-star-ep]').forEach(function(btn){btn.onclick=function(){
    setEpisodeRatingPending(x,season,Number(btn.getAttribute('data-episode')),Number(btn.getAttribute('data-star')));
    renderSeasonEditor(x,season,seasonDataCache[season]);
    renderSeasonTabs(x)
  }});
  document.querySelectorAll('[data-decimal-ep]').forEach(function(inp){inp.oninput=function(){
    var raw=inp.value;
    if(raw===''){setEpisodeRatingPending(x,season,Number(inp.getAttribute('data-episode')),null);renderSeasonTabs(x);return}
    var v=Number(raw);if(v>=1&&v<=10){setEpisodeRatingPending(x,season,Number(inp.getAttribute('data-episode')),v);renderSeasonTabs(x)}
  }});
  document.querySelectorAll('[data-clear-ep]').forEach(function(btn){btn.onclick=function(){
    setEpisodeRatingPending(x,season,Number(btn.getAttribute('data-episode')),null);
    renderSeasonEditor(x,season,seasonDataCache[season]);
    renderSeasonTabs(x)
  }});
  var stars=document.getElementById('modeStars'),dec=document.getElementById('modeDecimal');
  if(stars){stars.classList.toggle('active',episodeRatingMode==='stars');stars.onclick=function(){episodeRatingMode='stars';renderSeasonEditor(x,season,seasonDataCache[season])}}
  if(dec){dec.classList.toggle('active',episodeRatingMode==='decimal');dec.onclick=function(){episodeRatingMode='decimal';renderSeasonEditor(x,season,seasonDataCache[season])}}
  var save=document.getElementById('saveEpisodeRatings');
  if(save)save.onclick=function(){
    Object.keys(pendingEpisodeRatings).forEach(function(key){
      var v=pendingEpisodeRatings[key];
      if(v==null)delete saved.episodeRatings[key];else saved.episodeRatings[key]=Number(v)
    });
    pendingEpisodeRatings={};rememberItem(x);persist();
    renderEpisodeMatrix();renderTopEpisodes();renderSeasonTabs(x);
    renderSeasonEditor(x,season,seasonDataCache[season])
  };
  updateEpisodeSaveBar()
}
async function loadSeason(x,season){
  var area=document.getElementById('seasonArea');
  if(!area)return;
  activeRatingSeason=Number(season||1);
  renderSeasonTabs(x);
  if(seasonDataCache[activeRatingSeason]){
    renderSeasonEditor(x,activeRatingSeason,seasonDataCache[activeRatingSeason]);
    return
  }
  area.className='loading';area.innerHTML='Sezon yükleniyor…';
  try{
    var d=await api({action:'season',type:'tv',id:x.tmdbId,season:activeRatingSeason});
    seasonDataCache[activeRatingSeason]=d;
    renderSeasonEditor(x,activeRatingSeason,d)
  }catch(err){
    area.className='notice';area.textContent='Sezon verileri alınamadı.'
  }
}
window.onhashchange=function(){currentItem=null;render()};
render();
</script>
