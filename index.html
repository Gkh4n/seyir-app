lumns:220px 1fr;gap:26px;align-items:start}.detailposter{aspect-ratio:2/3;border-radius:22px;background:var(--poster);border:1px solid var(--line);position:relative;overflow:hidden}.detailposter:after{content:attr(data-letter);position:absolute;right:-20px;bottom:-32px;font-size:190px;font-weight:900;color:rgba(255,255,255,.08)}.detail h1{font-size:52px;line-height:1;margin:0 0 10px}.bigscore{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.scorebox{min-width:145px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.scorebox strong{display:block;font-size:25px}.slider{margin-top:18px}.slider input{width:100%;accent-color:var(--accent2)}.ratingHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:12px;color:var(--muted)}.ratingHead b{color:#b8b0ff;font-size:14px}.sliderScale{display:flex;justify-content:space-between;font-size:10px;color:#667084;margin-top:3px}.actions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.secondary{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;cursor:pointer}.chart{height:260px;border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px}.chart svg{width:100%;height:100%}.episodes{display:grid;gap:8px}.ep{display:grid;grid-template-columns:55px 1fr auto auto;gap:12px;background:var(--panel2);padding:11px;border-radius:12px}.profileHero{display:flex;gap:18px;align-items:center}.avatar{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:24px;font-weight:900}.searchResults{display:grid;gap:8px;margin-top:12px;max-height:520px;overflow:auto;padding-right:2px}.searchItem{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:11px;padding:8px;border:1px solid var(--line);background:var(--panel);border-radius:14px;cursor:pointer;transition:.18s}.searchItem:hover{border-color:#46516a;background:#171c27}.searchThumb{width:46px;height:64px;border-radius:9px;background:var(--thumb);background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.08)}.searchInfo{min-width:0}.searchInfo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.searchInfo span{display:block;font-size:12px;margin-top:2px}.searchScore{font-weight:800;color:var(--warn);padding-right:6px}.mobile{display:none}

.overview{max-width:820px;color:#b8c0ce;font-size:15px}

.creditChip{border:1px solid var(--line);background:#11151e;border-radius:99px;padding:6px 10px;color:#c5ccda;font-size:12px}

.seasonSelect{width:auto;min-width:150px}
.episodeRating{width:72px;padding:6px 7px}.seasonStats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.seasonStat{border:1px solid var(--line);background:#10141d;border-radius:14px;padding:12px}.seasonStat span{display:block;color:var(--muted);font-size:11px}.seasonStat b{display:block;margin-top:4px;font-size:17px}.seasonStat.good b{color:var(--good)}.seasonStat.bad b{color:var(--bad)}
.notice{border:1px solid #4a4230;background:#1b1810;color:#f5d98f;border-radius:14px;padding:12px 14px;margin-top:14px}
.tmdbNote{font-size:11px;color:var(--muted);margin-top:8px}.listHero{display:flex;justify-content:space-between;gap:18px;align-items:end}.listTabs{display:flex;gap:8px;margin-top:22px;overflow:auto;padding-bottom:2px}.listTab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 13px;cursor:pointer}.listTab.active{color:#fff;border-color:#5953a8;background:linear-gradient(135deg,rgba(138,125,255,.18),rgba(95,140,255,.12))}.listCount{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:5px;border-radius:99px;background:#252b38;font-size:10px}.emptyState{grid-column:1/-1;text-align:center;border:1px dashed var(--line);border-radius:18px;padding:36px 18px;color:var(--muted)}.profileCover{padding:26px;background:radial-gradient(circle at 85% 15%,rgba(138,125,255,.22),transparent 32%),linear-gradient(145deg,#151927,#0f121a);border:1px solid var(--line);border-radius:24px}.profileTop{display:flex;align-items:center;gap:16px}.profileMeta h1{margin:0;font-size:34px}.profileMeta p{margin:5px 0 0;color:var(--muted)}.profileBadge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:#c7c0ff;font-size:11px}.insightGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.insightCard{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:17px}.insightCard span{display:block;color:var(--muted);font-size:11px}.insightCard strong{display:block;margin-top:5px;font-size:20px}.ratingBars{display:grid;gap:8px;margin-top:12px}.ratingBar{display:grid;grid-template-columns:28px 1fr 28px;gap:9px;align-items:center;font-size:11px;color:var(--muted)}.ratingTrack{height:8px;background:#232936;border-radius:99px;overflow:hidden}.ratingFill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.catalogSearch{display:flex;gap:8px;margin-top:20px;max-width:680px;padding:7px;border:1px solid var(--line);background:#0b0e14;border-radius:15px}.catalogSearch input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:10px}.catalogSearch button{border:0;border-radius:11px;padding:10px 14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800}.catalogSearchResults{margin-top:12px;display:grid;gap:8px;max-width:680px}.catalogHint{margin-top:7px;font-size:11px;color:var(--muted)}

<body>
<header class="top">

</nav>

<main id="app"></main>

<button data-route="home">⌂<br>Keşfet</button><button data-route="series">▤<br>Diziler</button><button data-route="movies">▶<br>Filmler</button><button data-route="anime">✦<br>Anime</button><button data-route="lists">♡<br>Listeler</button><button data-route="profile">◉<br>Profil</button>
</nav>
<script>
var fallbackCatalogue=[
{id:'dark',key:'dark',source:'local',type:'Dizi',title:'Dark',year:'2017–2020',genre:'Bilim Kurgu',public:8.7,mine:9.4,poster:'linear-gradient(145deg,#0d5967,#24213f 58%,#090b10)'},
{id:'dexter',key:'dexter',source:'local',type:'Dizi',title:'Dexter',year:'2006–2013',genre:'Suç',public:8.6,mine:9.2,poster:'linear-gradient(145deg,#7a2430,#251417 58%,#090b10)'},
{id:'lost',key:'lost',source:'local',type:'Dizi',title:'Lost',year:'2004–2010',genre:'Gizem',public:8.3,mine:9.1,poster:'linear-gradient(145deg,#668a92,#263033 58%,#090b10)'},
{id:'supernatural',key:'supernatural',source:'local',type:'Dizi',title:'Supernatural',year:'2005–2020',genre:'Fantastik',public:8.4,mine:9.0,poster:'linear-gradient(145deg,#6b4d26,#241c15 58%,#090b10)'},
{id:'prisonbreak',key:'prisonbreak',source:'local',type:'Dizi',title:'Prison Break',year:'2005–2017',genre:'Aksiyon',public:8.3,mine:8.9,poster:'linear-gradient(145deg,#686965,#252626 58%,#090b10)'},
{id:'interstellar',key:'interstellar',source:'local',type:'Film',title:'Interstellar',year:'2014',genre:'Bilim Kurgu',public:8.7,mine:9.8,poster:'linear-gradient(145deg,#3e5a76,#171c26 58%,#090b10)'},
{id:'prestige',key:'prestige',source:'local',type:'Film',title:'The Prestige',year:'2006',genre:'Gizem',public:8.5,mine:9.3,poster:'linear-gradient(145deg,#8c5b32,#2c211b 58%,#090b10)'},
{id:'inception',key:'inception',source:'local',type:'Film',title:'Inception',year:'2010',genre:'Bilim Kurgu',public:8.8,mine:9.1,poster:'linear-gradient(145deg,#3c586b,#1d252e 58%,#090b10)'},
{id:'parasite',key:'parasite',source:'local',type:'Film',title:'Parasite',year:'2019',genre:'Gerilim',public:8.5,mine:8.3,poster:'linear-gradient(145deg,#4f6549,#1b201a 58%,#090b10)'},
{id:'shutter',key:'shutter',source:'local',type:'Film',title:'Shutter Island',year:'2010',genre:'Gerilim',public:8.2,mine:9.0,poster:'linear-gradient(145deg,#5c7782,#252c30 58%,#090b10)'}
];

var fallbackEpisodes={
dark:[['S1B1','Sırlar',8.3,8.8],['S1B2','Yalanlar',8.5,9.0],['S1B3','Geçmiş ve Şimdi',8.7,9.1],['S1B4','Çifte Hayatlar',8.6,9.2],['S1B5','Gerçekler',8.8,9.4],['S1B6','Sic Mundus',9.1,9.7],['S1B7','Kavşak',9.0,9.6],['S1B8','Ne Ekersen',9.2,9.8],['S1B9','Her Şey Şimdi',9.3,9.9],['S1B10','Alfa ve Omega',9.5,10]],
dexter:[['S1B1','Dexter',8.7,9.2],['S1B2','Crocodile',8.4,8.8],['S1B3','Popping Cherry',8.5,9.0],['S1B4','Return to Sender',8.8,9.4],['S1B5','Seeing Red',9.2,9.8]],
lost:[['S1B1','Pilot 1',9.2,9.8],['S1B2','Pilot 2',9.0,9.6],['S1B3','Tabula Rasa',8.4,9.0],['S1B4','Walkabout',9.3,9.8],['S1B5','White Rabbit',8.5,9.1]]
};

var saved=JSON.parse(localStorage.getItem('seyir-state')||'null')||{};
if(!saved.ratings)saved.ratings={};
if(!saved.favorites)saved.favorites=[];
if(!saved.watchlist)saved.watchlist=[];
if(!saved.items)saved.items={};
if(!saved.episodeRatings)saved.episodeRatings={};
if(!saved.movieLogs)saved.movieLogs={};
if(!saved.dataVersion){
  var noRealData=Object.keys(saved.ratings).length===0&&Object.keys(saved.items).length===0&&Object.keys(saved.episodeRatings).length===0&&Object.keys(saved.movieLogs).length===0;
  if(noRealData){
    saved.favorites=[];
    saved.watchlist=[];
  }
  saved.dataVersion=2;
  localStorage.setItem('seyir-state',JSON.stringify(saved));
}

var currentItem=null;
var activeListTab='favorites';
var searchTimer=null;
var searchSeq=0;

function persist(){localStorage.setItem('seyir-state',JSON.stringify(saved))}
function h(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function publicScore(v){var n=Number(v||0);return n>0?n.toFixed(1):'—'}
function personalScore(x){if(saved.ratings[x.key]!=null)return Number(saved.ratings[x.key]);if(x.source==='local'&&x.mine!=null)return Number(x.mine);return null}
function posterValue(path,title){
  if(path)return "linear-gradient(transparent 35%,rgba(5,7,11,.96)),url('https://image.tmdb.org/t/p/w500"+path+"') center/cover";
  var ch=(title||'S').charCodeAt(0)%5;
  var colors=['#263c59','#47365f','#5a382d','#29504c','#514b2f'];
  return 'linear-gradient(145deg,'+colors[ch]+',#171b23 58%,#090b10)';
}
function mediaLabel(type){return type==='tv'?'Dizi':'Film'}
function tmdbToItem(r){
  var mt=r.media_type||(r.number_of_seasons!=null?'tv':'movie');
  var title=r.title||r.name||'İsimsiz';
  var date=r.release_date||r.first_air_date||'';
  return {
    key:'tmdb-'+mt+'-'+r.id,
    source:'tmdb',
    tmdbId:r.id,
    mediaType:mt,
    type:mediaLabel(mt),
    title:title,
    year:date?date.slice(0,4):'—',
    genre:'TMDB',
    public:Number(r.vote_average||0),
    poster:posterValue(r.poster_path,title),
    posterPath:r.poster_path||null
  };
}
function rememberItem(x){
  if(x&&x.source==='tmdb'){
    saved.items[x.key]={
      key:x.key,source:'tmdb',tmdbId:x.tmdbId,mediaType:x.mediaType,type:x.type,title:x.title,
      year:x.year,genre:x.genre,public:x.public,poster:x.poster,posterPath:x.posterPath||null
    };
    persist();
  }
}
function getItem(key){
  var local=fallbackCatalogue.find(function(x){return x.key===key});
  return local||saved.items[key]||null;
}
async function api(params){
  var qs=new URLSearchParams(params);
  var res=await fetch('/api/tmdb?'+qs.toString());
  var data=await res.json().catch(function(){return {}});
  if(!res.ok)throw new Error(data.error||'API isteği başarısız');
  return data;
}
function openCode(x){return x.source==='tmdb'?'tmdb:'+x.mediaType+':'+x.tmdbId:'local:'+x.key}
function openFromCode(code){
  var p=code.split(':');
  if(p[0]==='tmdb')location.hash='tmdb/'+p[1]+'/'+p[2];
  else location.hash='detail/'+p[1];
}
function card(x){
  var mine=personalScore(x);
  return '<article class="card" data-open="'+h(openCode(x))+'"><div class="poster" style="--poster:'+x.poster+'"><span class="letter">'+h(x.title[0]||'S')+'</span><span class="tag">'+h(x.type)+'</span><div class="meta"><b>'+h(x.title)+'</b><span>'+h(x.year)+' · '+h(x.genre||'')+'</span></div></div><div class="scores"><span>TMDB <b>'+publicScore(x.public)+'</b></span><span>Ben <b>'+(mine==null?'—':mine.toFixed(1))+'</b></span></div></article>'
}
function section(title,sub,items,id){
  return '<section><div class="head"><div><h2>'+h(title)+'</h2><div class="muted">'+h(sub)+'</div></div></div><div class="grid"'+(id?' id="'+id+'"':'')+'>'+items.map(card).join('')+'</div></section>'
}
function home(){
  var diffs=fallbackCatalogue.slice().sort(function(a,b){return Math.abs((personalScore(b)||0)-b.public)-Math.abs((personalScore(a)||0)-a.public)}).slice(0,4);
  return '<div class="hero"><div class="box copy"><div class="eyebrow">✦ İzleme zevkinin haritası</div><h1>Ne izlediğini değil, <span>nasıl sevdiğini</span> gör.</h1><p>Dizi ve filmleri puanla, bölüm bölüm takip et ve kendi zevk profilini genel izleyiciyle karşılaştır.</p><div class="search"><input id="q" placeholder="Dizi veya film ara…"><button id="searchBtn">Ara</button></div><div id="searchResults" class="searchResults"></div><div id="tmdbStatus" class="tmdbNote">TMDB bağlantısı kontrol ediliyor…</div></div><aside class="box taste"><div><div class="muted">ZEVK UYUM PROFİLİ</div><strong>82<small>/100</small></strong><div class="bar"><i></i></div></div><p class="muted">Bu skor ileride gerçek puan geçmişinden otomatik hesaplanacak.</p></aside></div>'+
  section('Bu hafta öne çıkanlar','TMDB haftalık popüler verileri yükleniyor',fallbackCatalogue.slice(0,5),'trendingGrid')+
  '<section><div class="head"><div><h2>Profil özeti</h2><div class="muted">Kişisel verilerinden hesaplanan özet</div></div></div>'+profileStats()+'</section>'+

function profile(){
  var rated=ratedItems();
  var ratingVals=Object.keys(saved.ratings).map(function(k){return Number(saved.ratings[k])}).filter(function(v){return isFinite(v)});
  var avg=ratingVals.length?ratingVals.reduce(function(a,b){return a+b},0)/ratingVals.length:0;
  var withPublic=rated.filter(function(x){return Number(x.public)>0});
  var publicAvg=withPublic.length?withPublic.reduce(function(s,x){return s+Number(x.public)},0)/withPublic.length:0;
  var bias=withPublic.length?avg-publicAvg:0;
  var biasLabel=!withPublic.length?'Henüz hesaplanmadı':Math.abs(bias)<.2?'Genel izleyiciyle dengeli':bias>0?'Genel izleyiciden daha cömert':'Genel izleyiciden daha seçici';
  var top=rated[0]||null;
  var diffs=rated.slice().sort(function(a,b){return Math.abs(Number(saved.ratings[b.key])-Number(b.public||0))-Math.abs(Number(saved.ratings[a.key])-Number(a.public||0))}).slice(0,5);
  var typeCounts=rated.reduce(function(acc,x){acc[x.type]=(acc[x.type]||0)+1;return acc},{});
  var epCount=Object.keys(saved.episodeRatings).length;
  var loggedMovies=Object.keys(saved.movieLogs).length;
  var dist=[];
  for(var i=1;i<=10;i++){dist.push(ratingVals.filter(function(v){return Math.round(v)===i}).length)}
  var maxDist=Math.max.apply(null,dist.concat([1]));
  var bars=dist.map(function(n,i){return '<div class="ratingBar"><span>'+(i+1)+'</span><div class="ratingTrack"><div class="ratingFill" style="width:'+((n/maxDist)*100)+'%"></div></div><span>'+n+'</span></div>'}).join('');
  return '<div class="profileCover"><div class="profileTop"><div class="avatar">S</div><div class="profileMeta"><h1>Seyir profilin</h1><p>Puanların ve listelerinden oluşan gerçek kişisel özet.</p><div class="profileBadge">● Veriler şimdilik bu cihazda saklanıyor</div></div></div></div>'+
  '<section>'+profileStats()+'</section>'+
  '<section><div class="insightGrid"><div class="insightCard"><span>Puanlama tarzın</span><strong>'+h(biasLabel)+'</strong>'+(withPublic.length?'<small class="muted">'+(bias>=0?'+':'')+bias.toFixed(1)+' TMDB farkı</small>':'')+'</div><div class="insightCard"><span>En yüksek puanın</span><strong>'+(top?h(top.title)+' · '+Number(saved.ratings[top.key]).toFixed(1):'—')+'</strong></div><div class="insightCard"><span>Bölüm puanların</span><strong>'+epCount+'</strong><small class="muted">'+loggedMovies+' film günlüğü kaydı</small></div></div></section>'+
  '<section class="split"><div class="panel"><h3>En çok ayrıştıkların</h3><div class="rows">'+(diffs.length?diffs.map(function(x){var d=Number(saved.ratings[x.key])-Number(x.public||0);return '<div class="row" data-open="'+h(openCode(x))+'"><span><b>'+h(x.title)+'</b><br><small class="muted">'+h(x.type)+' · Sen '+Number(saved.ratings[x.key]).toFixed(1)+' · TMDB '+publicScore(x.public)+'</small></span><b class="delta '+(d<0?'neg':'')+'">'+(d>0?'+':'')+d.toFixed(1)+'</b></div>'}).join(''):'<p class="muted">Puan verdikçe genel izleyiciyle en çok ayrıştığın yapımlar burada görünecek.</p>')+'</div></div><div class="panel"><h3>Puan dağılımın</h3>'+(ratingVals.length?'<div class="ratingBars">'+bars+'</div>':'<p class="muted">Dağılımı görmek için birkaç yapıma puan ver.</p>')+'</div></section>'+
  '<section class="panel"><h3>Arşiv özeti</h3><div class="rows"><div class="row"><span>Puanladığın diziler</span><b>'+(typeCounts.Dizi||0)+'</b></div><div class="row"><span>Puanladığın filmler</span><b>'+(typeCounts.Film||0)+'</b></div><div class="row"><span>Favoriler</span><b>'+saved.favorites.length+'</b></div><div class="row"><span>İzleme listesi</span><b>'+saved.watchlist.length+'</b></div></div></section>'
}
function chart(data){
  if(!data.length)return '<div class="loading">Bu sezon için bölüm verisi yok.</div>';
  var w=700,hgt=220,p=28;
  function y(v){return hgt-p-(Math.max(0,Math.min(10,Number(v||0)))/10)*(hgt-2*p)}
  function pointX(i){return p+i*(w-2*p)/(Math.max(1,data.length-1))}
  function path(idx){
    var pts=[];
    data.forEach(function(e,i){var v=e[idx];if(v!=null&&Number(v)>0)pts.push((pts.length?'L':'M')+pointX(i)+' '+y(v))});
    return pts.join(' ')
  }
  var dots=data.map(function(e,i){return e[3]!=null?'<circle cx="'+pointX(i)+'" cy="'+y(e[3])+'" r="3.5" fill="#8a7dff"/>':''}).join('');
  return '<svg viewBox="0 0 '+w+' '+hgt+'" preserveAspectRatio="none"><line x1="'+p+'" y1="'+y(5)+'" x2="'+(w-p)+'" y2="'+y(5)+'" stroke="#2d3442"/><path d="'+path(2)+'" fill="none" stroke="#ffc85a" stroke-width="3"/><path d="'+path(3)+'" fill="none" stroke="#8a7dff" stroke-width="3"/>'+dots+'</svg>'
}
function localDetail(id){
  var x=fallbackCatalogue.find(function(a){return a.key===id});
  if(!x)return home();
  currentItem=x;
  var eps=fallbackEpisodes[id]||[];
  return detailShell(x,'',eps)
}
function detailShell(x,extra,eps){

  if(x.type==='Dizi'&&eps){
    body+='<section class="split"><div class="panel"><h3>Bölüm puan grafiği</h3><div class="muted" style="margin-bottom:8px">Sarı: TMDB · Mor: sen</div><div class="chart">'+chart(eps)+'</div></div><div class="panel"><h3>1. sezon bölümleri</h3><div class="episodes">'+eps.map(function(e){return '<div class="ep"><span class="muted">'+h(e[0])+'</span><b>'+h(e[1])+'</b><span style="color:#ffc85a">'+publicScore(e[2])+'</span><span class="mineep" style="color:#a89fff">'+(e[3]==null?'—':Number(e[3]).toFixed(1))+'</span></div>'}).join('')+'</div></div></section>'
  }
  return body
}
function remoteLoading(){return '<div class="loading">TMDB verileri yükleniyor…</div>'}
function route(){
  var hash=location.hash.replace('#','');
  if(hash.indexOf('detail/')===0)return localDetail(hash.split('/')[1]);
  if(hash.indexOf('tmdb/')===0)return remoteLoading();
  if(hash==='series')return cataloguePage('tv');
  if(hash==='movies')return cataloguePage('movie');
  if(hash==='anime')return cataloguePage('anime');
  if(hash==='lists')return lists();
  if(hash==='profile')return profile();
  return home()
}
function render(){
  document.getElementById('app').innerHTML=route();
  var base=location.hash.replace('#','').split('/')[0]||'home';
  document.querySelectorAll('[data-route]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-route')===base)});
  bind();
  if(base==='home')loadHomeRemote();
  if(base==='series')loadCatalogue('tv');
  if(base==='movies')loadCatalogue('movie');
  if(base==='anime')loadCatalogue('anime');
  if(base==='tmdb'){
    var p=location.hash.replace('#','').split('/');
    loadTmdbDetail(p[1],p[2]);
  }
}
function bind(){
  document.querySelectorAll('[data-route]').forEach(function(b){b.onclick=function(){var r=b.getAttribute('data-route');location.hash=r==='home'?'':r}});
  bindOpeners();
  var sb=document.getElementById('searchBtn');
  if(sb)sb.onclick=search;
  var q=document.getElementById('q');
  if(q){
    q.onkeydown=function(e){if(e.key==='Enter'){clearTimeout(searchTimer);search()}};
    q.oninput=function(){
      clearTimeout(searchTimer);
      var value=(q.value||'').trim();
      var box=document.getElementById('searchResults');
      if(!value){if(box)box.innerHTML='';return}
      searchTimer=setTimeout(function(){search(value)},250)
    }
  }
  var cq=document.getElementById('catalogQ');
  var csb=document.getElementById('catalogSearchBtn');
  if(cq){
    var kind=location.hash.replace('#','')==='series'?'tv':(location.hash.replace('#','')==='movies'?'movie':'anime');
    if(csb)csb.onclick=function(){clearTimeout(searchTimer);categorySearch(kind)};
    cq.onkeydown=function(e){if(e.key==='Enter'){clearTimeout(searchTimer);categorySearch(kind)}};
    cq.oninput=function(){
      clearTimeout(searchTimer);
      var value=(cq.value||'').trim();
      var box=document.getElementById('catalogSearchResults');
      if(!value){if(box)box.innerHTML='';return}
      searchTimer=setTimeout(function(){categorySearch(kind,value)},250)
    }
  }
  document.querySelectorAll('[data-list-tab]').forEach(function(btn){btn.onclick=function(){
    activeListTab=btn.getAttribute('data-list-tab');
    document.querySelectorAll('[data-list-tab]').forEach(function(b){b.classList.toggle('active',b===btn)});
    var grid=document.getElementById('listGrid');
    if(grid){grid.innerHTML=listGridHtml(activeListTab);bindOpeners()}
  }});
  if(currentItem)bindPersonalControls(currentItem);
}
function bindOpeners(){
  document.querySelectorAll('[data-open]').forEach(function(el){el.onclick=function(){openFromCode(el.getAttribute('data-open'))}});
}
function bindPersonalControls(x){
  var slider=document.getElementById('ratingSlider');
  if(slider){
    slider.oninput=function(){var v=Number(slider.value).toFixed(1);document.getElementById('mineScore').textContent=v;var live=document.getElementById('sliderLive');if(live)live.textContent=v};
    var save=document.getElementById('saveRating');
    if(save)save.onclick=function(){
      saved.ratings[x.key]=Number(slider.value);
      rememberItem(x);persist();render()
    }
  }
  document.querySelectorAll('[data-fav]').forEach(function(b){b.onclick=function(){
    var key=b.getAttribute('data-fav'),i=saved.favorites.indexOf(key);
    if(i>-1)saved.favorites.splice(i,1);else saved.favorites.push(key);
    rememberItem(x);persist();render()
  }});
  document.querySelectorAll('[data-watch]').forEach(function(b){b.onclick=function(){
    var key=b.getAttribute('data-watch'),i=saved.watchlist.indexOf(key);
    if(i>-1)saved.watchlist.splice(i,1);else saved.watchlist.push(key);
    rememberItem(x);persist();render()
  }})
}
async function loadCatalogue(type){
  var grid=document.getElementById('catalogGrid');
  var meta=document.getElementById('catalogMeta');
  if(!grid)return;
  try{
    var data=await api({action:'catalog',type:type});
    var items=(data.results||[]).slice(0,20).map(tmdbToItem);
    grid.innerHTML=items.length?items.map(card).join(''):'<div class="loading" style="grid-column:1/-1">İçerik bulunamadı.</div>';
    if(meta)meta.textContent=items.length+' gerçek '+(type==='tv'?'dizi':type==='movie'?'film':'anime')+' gösteriliyor.';
    bindOpeners()
  }catch(err){
    var fallbackType=type==='tv'?'Dizi':'Film';
    var items=type==='anime'?[]:fallbackCatalogue.filter(function(x){return x.type===fallbackType});
    grid.innerHTML=items.map(card).join('');
    if(meta)meta.textContent='TMDB kataloğu şu an alınamadı; örnek veriler gösteriliyor.';
    bindOpeners()
  }
}

async function categorySearch(type,forcedQuery){
  var input=document.getElementById('catalogQ');
  var box=document.getElementById('catalogSearchResults');
  if(!box)return;
  var q=(forcedQuery!=null?forcedQuery:(input&&input.value||'')).trim();
  if(!q){box.innerHTML='';return}
  var mySeq=++searchSeq;
  box.innerHTML='<div class="muted">Aranıyor…</div>';
  try{
    var data=await api({action:'search',q:q,type:type});
    if(mySeq!==searchSeq)return;
    var nq=normalizeText(q);
    var items=(data.results||[]).map(tmdbToItem).sort(function(a,b){
      var at=normalizeText(a.title),bt=normalizeText(b.title);
      var ae=at===nq?1:0,be=bt===nq?1:0;
      if(ae!==be)return be-ae;
      var as=at.indexOf(nq)===0?1:0,bs=bt.indexOf(nq)===0?1:0;
      if(as!==bs)return bs-as;
      return Number(b.public||0)-Number(a.public||0)
    }).slice(0,8);
    box.innerHTML=items.length?items.map(searchResultRow).join(''):'<div class="muted">Bu kategoride sonuç bulunamadı.</div>';
    bindOpeners()
  }catch(err){
    if(mySeq!==searchSeq)return;
    box.innerHTML='<div class="notice">Arama şu an kullanılamıyor.</div>'
  }
}

async function loadHomeRemote(){
  var status=document.getElementById('tmdbStatus');
  try{
    var st=await api({action:'status'});
    if(status)status.textContent=st.configured?'✓ TMDB bağlı — arama gerçek katalogda çalışıyor.':'TMDB anahtarı henüz eklenmedi; örnek katalog gösteriliyor.';
    if(!st.configured)return;
    var data=await api({action:'trending'});
    var items=(data.results||[]).slice(0,10).map(tmdbToItem);
    var grid=document.getElementById('trendingGrid');
    if(grid&&items.length){grid.innerHTML=items.map(card).join('');bindOpeners()}
  }catch(err){
    if(status)status.textContent='TMDB şu an kullanılamıyor; örnek verilerle devam ediliyor.'
  }
}
function normalizeText(v){
  return String(v||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()
}
function searchResultRow(x){
  var thumb=x.posterPath?"url('https://image.tmdb.org/t/p/w185"+x.posterPath+"') center/cover":x.poster;
  return '<div class="searchItem" data-open="'+h(openCode(x))+'"><div class="searchThumb" style="--thumb:'+thumb+'"></div><div class="searchInfo"><b>'+h(x.title)+'</b><span class="muted">'+h(x.type)+' · '+h(x.year)+'</span></div><div class="searchScore">★ '+publicScore(x.public)+'</div></div>'
}
async function search(forcedQuery){
  var input=document.getElementById('q');
  var box=document.getElementById('searchResults');
  var q=(forcedQuery!=null?forcedQuery:(input&&input.value||'')).trim();
  if(!q){if(box)box.innerHTML='';return}
  var mySeq=++searchSeq;
  box.innerHTML='<div class="muted">Aranıyor…</div>';
  try{
    var data=await api({action:'search',q:q});
    if(mySeq!==searchSeq)return;
    var nq=normalizeText(q);
    var items=(data.results||[]).map(tmdbToItem).sort(function(a,b){
      var at=normalizeText(a.title),bt=normalizeText(b.title);
      var ae=at===nq?1:0,be=bt===nq?1:0;
      if(ae!==be)return be-ae;
      var as=at.indexOf(nq)===0?1:0,bs=bt.indexOf(nq)===0?1:0;
      if(as!==bs)return bs-as;
      return Number(b.public||0)-Number(a.public||0)
    }).slice(0,10);
    box.innerHTML=items.length?items.map(searchResultRow).join(''):'<div class="muted">Sonuç bulunamadı.</div>';
    bindOpeners()
  }catch(err){
    if(mySeq!==searchSeq)return;
    var low=normalizeText(q);
    var hits=fallbackCatalogue.filter(function(x){return normalizeText(x.title).indexOf(low)>-1||normalizeText(x.genre).indexOf(low)>-1});
    box.innerHTML='<div class="notice">TMDB şu an kullanılamıyor. Örnek katalogda arandı.</div>'+hits.map(searchResultRow).join('');
    bindOpeners()
  }
}
async function loadTmdbDetail(type,id){
  var app=document.getElementById('app');
  try{
    var d=await api({action:'details',type:type,id:id});
    var x=tmdbToItem(Object.assign({},d,{media_type:type}));
    x.genre=(d.genres||[]).map(function(g){return g.name}).slice(0,3).join(' · ')||'';
    currentItem=x;
    var overview=d.overview?'<p class="overview">'+h(d.overview)+'</p>':'';
    var director='';
    if(type==='movie'&&d.credits&&d.credits.crew){
      var dir=d.credits.crew.find(function(c){return c.job==='Director'});
      if(dir)director='<span class="creditChip">Yönetmen: '+h(dir.name)+'</span>'
    }
    var cast=(d.credits&&d.credits.cast?d.credits.cast.slice(0,5):[]).map(function(c){return '<span class="creditChip">'+h(c.name)+'</span>'}).join('');
    var credits=(director||cast)?'<div class="creditList">'+director+cast+'</div>':'';
    app.innerHTML=detailShell(x,overview+credits,null);
    if(type==='tv'){
      var count=Math.max(1,Number(d.number_of_seasons||1));
      var options='';
      for(var i=1;i<=count;i++)options+='<option value="'+i+'">'+i+'. sezon</option>';
      app.innerHTML+='<section class="panel"><div class="head"><div><h2>Bölüm analizi</h2><div class="muted">Her bölüm için TMDB puanı ve senin puanın</div></div></div><div class="seasonToolbar"><select id="seasonSelect" class="seasonSelect">'+options+'</select></div><div id="seasonArea" class="loading">Sezon yükleniyor…</div></section>';
    }else{
      var log=saved.movieLogs[x.key]||{rewatches:0,note:''};
      app.innerHTML+='<section class="panel"><h3>Film günlüğüm</h3><div class="split"><div><label class="muted">Kaç kez izledin?</label><input id="rewatches" class="fieldInput" type="number" min="0" max="99" value="'+Number(log.rewatches||0)+'"></div><div><label class="muted">Kısa notun</label><textarea id="movieNote" placeholder="Bu film sende ne bıraktı?">'+h(log.note||'')+'</textarea></div></div><div class="actions"><button id="saveMovieLog" class="primary">Günlüğü kaydet</button></div></section>'
    }
    bindPersonalControls(x);
    bindOpeners();
    if(type==='tv'){
      var select=document.getElementById('seasonSelect');
      select.onchange=function(){loadSeason(x,Number(select.value))};
      loadSeason(x,1)
    }else{
      document.getElementById('saveMovieLog').onclick=function(){
        saved.movieLogs[x.key]={rewatches:Number(document.getElementById('rewatches').value||0),note:document.getElementById('movieNote').value||''};
        rememberItem(x);persist();
        document.getElementById('saveMovieLog').textContent='Kaydedildi ✓'
      }
    }
  }catch(err){
    app.innerHTML='<div class="notice">TMDB verisi alınamadı. Vercel üzerinde TMDB_API_KEY eklenmiş olmalı.</div>'
  }
}
async function loadSeason(x,season){
  var area=document.getElementById('seasonArea');
  if(!area)return;
  area.className='loading';area.innerHTML='Sezon yükleniyor…';
  try{
    var d=await api({action:'season',type:'tv',id:x.tmdbId,season:season});
    var rows=(d.episodes||[]).map(function(ep){
      var epKey=x.key+'-s'+season+'e'+ep.episode_number;
      var mine=saved.episodeRatings[epKey];
      return ['S'+season+'B'+ep.episode_number,ep.name||('Bölüm '+ep.episode_number),Number(ep.vote_average||0),mine!=null?Number(mine):null,epKey]
    });
    area.className='';
    var rated=rows.filter(function(e){return Number(e[2])>0});
    var avg=rated.length?rated.reduce(function(s,e){return s+Number(e[2])},0)/rated.length:0;
    var best=rated.slice().sort(function(a,b){return b[2]-a[2]})[0]||null;
    var worst=rated.slice().sort(function(a,b){return a[2]-b[2]})[0]||null;
    var summary='<div class="seasonStats"><div class="seasonStat"><span>Sezon ortalaması</span><b>'+publicScore(avg)+'</b></div><div class="seasonStat good"><span>En iyi bölüm</span><b>'+(best?h(best[0])+' · '+publicScore(best[2]):'—')+'</b></div><div class="seasonStat bad"><span>En düşük bölüm</span><b>'+(worst?h(worst[0])+' · '+publicScore(worst[2]):'—')+'</b></div></div>';
    area.innerHTML=summary+'<div class="split"><div><div class="chart">'+chart(rows)+'</div><div class="tmdbNote">Sarı: TMDB bölüm puanı · Mor: senin verdiğin bölüm puanı</div></div><div class="episodes">'+rows.map(function(e){return '<div class="ep"><span class="muted">'+h(e[0])+'</span><b>'+h(e[1])+'</b><span style="color:#ffc85a">'+publicScore(e[2])+'</span><input class="episodeRating" data-ep="'+h(e[4])+'" type="number" min="1" max="10" step=".1" placeholder="—" value="'+(e[3]==null?'':e[3].toFixed(1))+'"></div>'}).join('')+'</div></div>';
    document.querySelectorAll('[data-ep]').forEach(function(inp){inp.onchange=function(){
      var v=Number(inp.value);
      if(v>=1&&v<=10)saved.episodeRatings[inp.getAttribute('data-ep')]=v;
      else delete saved.episodeRatings[inp.getAttribute('data-ep')];
      rememberItem(x);persist();loadSeason(x,season)
    }})
  }catch(err){
    area.className='notice';area.textContent='Sezon verileri alınamadı.'
  }
}
window.onhashchange=function(){currentItem=null;render()};
render();
</script>
